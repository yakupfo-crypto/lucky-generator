<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Generator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://bundle.run/zustand@4.3.8"></script>
    <style>
        .ball { @apply w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm border transition-all cursor-pointer; }
        .ball-selected { @apply bg-blue-600 text-white border-blue-700 shadow-inner; }
        .ball-joker { @apply bg-red-50 text-red-700 border-red-200; }
        .ball-joker-selected { @apply bg-red-600 text-white border-red-700; }
        .nav-btn { @apply flex-1 py-3 text-white font-medium text-center transition-colors; }
    </style>
</head>
<body class="bg-slate-50 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- UTILS (Mantıksal Değişiklik Yok, Sadece Temizlendi) ---
        const secureRandomInt = (max) => {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        };

        const secureShuffle = (array) => {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        // --- STATE MANAGEMENT (Zustand Mimarisi) ---
        const useStore = (() => {
            const saved = JSON.parse(localStorage.getItem("savedGroups") || "[]");
            return () => {
                const [groups, setGroups] = useState(saved);
                const [view, setView] = useState("generate"); // generate, mySets, detail
                const [activeGroupId, setActiveGroupId] = useState(null);

                useEffect(() => {
                    localStorage.setItem("savedGroups", JSON.stringify(groups));
                }, [groups]);

                return { groups, setGroups, view, setView, activeGroupId, setActiveGroupId };
            };
        })();

        // --- COMPONENTS ---

        const Ball = ({ val, isJoker, isMatched }) => (
            <div className={`ball ${isJoker ? (isMatched ? 'ball-joker-selected' : 'ball-joker') : (isMatched ? 'ball-selected' : 'bg-white text-slate-700 border-slate-200')}`}>
                {val}
            </div>
        );

        const App = () => {
            const store = useStore();
            const [inputs, setInputs] = useState({ max: 35, per: 5, jMax: 31, jPer: 1, count: 5 });
            const [tempSets, setTempSets] = useState([]);
            const [groupName, setGroupName] = useState("");
            const [showPanel, setShowPanel] = useState(false);

            // Kolon Üretme
            const generate = () => {
                const sets = [];
                for (let i = 0; i < inputs.count; i++) {
                    const numbers = secureShuffle(Array.from({length: inputs.max}, (_, i) => i + 1))
                        .slice(0, inputs.per).sort((a,b) => a-b);
                    const jokers = secureShuffle(Array.from({length: inputs.jMax}, (_, i) => i + 1))
                        .slice(0, inputs.jPer).sort((a,b) => a-b);
                    sets.push({ numbers, jokers });
                }
                setTempSets(sets);
            };

            const saveGroup = () => {
                if (!groupName.trim()) return alert("İsim gerekli!");
                const newGroup = {
                    id: Date.now().toString(),
                    name: groupName,
                    sets: tempSets,
                    config: {...inputs},
                    results: { main: [], joker: [] }
                };
                store.setGroups([...store.groups, newGroup]);
                setTempSets([]);
                setGroupName("");
                store.setView("mySets");
            };

            const toggleResult = (type, val) => {
                const updated = store.groups.map(g => {
                    if (g.id === store.activeGroupId) {
                        const list = g.results[type];
                        const newList = list.includes(val) ? list.filter(v => v !== val) : [...list, val];
                        return { ...g, results: { ...g.results, [type]: newList } };
                    }
                    return g;
                });
                store.setGroups(updated);
            };

            const activeGroup = store.groups.find(g => g.id === store.activeGroupId);

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col">
                    <header className="bg-blue-600 text-white py-6 text-center shadow-lg sticky top-0 z-40">
                        <h1 className="text-xl font-bold tracking-tight">LUCKY GENERATOR PRO</h1>
                    </header>

                    <main className="p-4 flex-grow">
                        {store.view === 'generate' && (
                            <div className="space-y-4">
                                <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                                    <h2 className="text-blue-600 font-bold border-b pb-2 mb-4">Ayarlar</h2>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-slate-500 uppercase font-bold">Havuz</label>
                                            <input type="number" className="w-full p-2 bg-slate-50 border rounded-lg" value={inputs.max} onChange={e => setInputs({...inputs, max: +e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-500 uppercase font-bold">Seçilecek</label>
                                            <input type="number" className="w-full p-2 bg-slate-50 border rounded-lg" value={inputs.per} onChange={e => setInputs({...inputs, per: +e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-500 uppercase font-bold">Joker Havuz</label>
                                            <input type="number" className="w-full p-2 bg-slate-50 border rounded-lg" value={inputs.jMax} onChange={e => setInputs({...inputs, jMax: +e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-500 uppercase font-bold">Joker Adet</label>
                                            <input type="number" className="w-full p-2 bg-slate-50 border rounded-lg" value={inputs.jPer} onChange={e => setInputs({...inputs, jPer: +e.target.value})} />
                                        </div>
                                    </div>
                                    <button onClick={generate} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">KOLONLARI ÜRET</button>
                                </section>

                                {tempSets.map((set, i) => (
                                    <div key={i} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <b className="text-slate-400 text-xs block mb-2">{i+1}. KOLON</b>
                                        <div className="flex flex-wrap gap-2">
                                            {set.numbers.map(n => <Ball key={n} val={n} />)}
                                            {set.jokers.map(j => <Ball key={j} val={j} isJoker />)}
                                        </div>
                                    </div>
                                ))}

                                {tempSets.length > 0 && (
                                    <div className="bg-white p-5 rounded-2xl shadow-md border-t-4 border-green-500">
                                        <input type="text" placeholder="Grup Adı (Örn: Süper Loto)" className="w-full p-3 border rounded-lg mb-3" value={groupName} onChange={e => setGroupName(e.target.value)} />
                                        <button onClick={saveGroup} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold">GRUBU KAYDET</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {store.view === 'mySets' && (
                            <div className="space-y-4">
                                <h2 className="font-bold text-slate-700 text-lg">Kayıtlı Listelerim</h2>
                                {store.groups.length === 0 && <p className="text-slate-400">Henüz kayıt yok.</p>}
                                {store.groups.map(g => (
                                    <div key={g.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bold text-slate-800">{g.name}</h3>
                                            <p className="text-xs text-slate-500">{g.sets.length} Kolon | {new Date(+g.id).toLocaleDateString()}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {store.setActiveGroupId(g.id); store.setView('detail');}} className="bg-blue-100 text-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Aç</button>
                                            <button onClick={() => store.setGroups(store.groups.filter(x => x.id !== g.id))} className="bg-red-50 text-red-500 p-2 rounded-lg">Sil</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {store.view === 'detail' && activeGroup && (
                            <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                    <button onClick={() => store.setView('mySets')} className="text-blue-600 font-bold">← Geri</button>
                                    <h2 className="font-bold text-lg">{activeGroup.name}</h2>
                                    <button onClick={() => setShowPanel(true)} className="bg-orange-500 text-white px-3 py-1 rounded-lg text-xs font-bold">Sonuç Gir</button>
                                </div>

                                {activeGroup.sets.map((set, i) => (
                                    <div key={i} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                                        <div className="flex flex-wrap gap-2">
                                            {set.numbers.map(n => <Ball key={n} val={n} isMatched={activeGroup.results.main.includes(n)} />)}
                                            {set.jokers.map(j => <Ball key={j} val={j} isJoker isMatched={activeGroup.results.joker.includes(j)} />)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Result Entry Panel (Modal-like) */}
                    {showPanel && activeGroup && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end">
                            <div className="bg-white w-full max-h-[80vh] rounded-t-3xl p-6 overflow-y-auto shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-bold text-xl text-slate-800">Kazanan Numaralar</h3>
                                    <button onClick={() => setShowPanel(false)} className="text-slate-400 text-2xl">&times;</button>
                                </div>
                                <div className="space-y-6">
                                    <div>
                                        <p className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">Ana Sayılar</p>
                                        <div className="flex flex-wrap gap-2">
                                            {Array.from({length: activeGroup.config.max}, (_, i) => i + 1).map(n => (
                                                <div key={n} onClick={() => toggleResult('main', n)} 
                                                     className={`ball ${activeGroup.results.main.includes(n) ? 'ball-selected' : 'bg-slate-50'}`}>
                                                    {n}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    {activeGroup.config.jPer > 0 && (
                                        <div>
                                            <p className="text-xs font-bold text-red-400 mb-3 uppercase tracking-widest">Joker Sayılar</p>
                                            <div className="flex flex-wrap gap-2">
                                                {Array.from({length: activeGroup.config.jMax}, (_, i) => i + 1).map(n => (
                                                    <div key={n} onClick={() => toggleResult('joker', n)} 
                                                         className={`ball ${activeGroup.results.joker.includes(n) ? 'ball-joker-selected' : 'ball-joker'}`}>
                                                        {n}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => setShowPanel(false)} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200">TAMAMLA</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 w-full max-w-md bg-blue-700 flex border-t border-blue-800 shadow-2xl z-40">
                        <button onClick={() => store.setView('generate')} className={`nav-btn ${store.view === 'generate' ? 'bg-blue-800' : ''}`}>ÜRET</button>
                        <button onClick={() => store.setView('mySets')} className={`nav-btn ${store.view !== 'generate' ? 'bg-blue-800' : ''}`}>KAYITLARIM</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
