<style>

    .division-transferred-ball.result-selected{background:#1976d2;color:#fff;border:none;}

    .parity-result-card{background:white;padding:15px;border-radius:10px;margin-top:18px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}

    .parity-result-number{font-family:monospace;font-size:17px;font-weight:bold;line-height:1.8;overflow-wrap:anywhere;color:#222;border-bottom:1px solid #eee;padding:4px 0;}

    .batch-row-number-card{margin-top:18px;padding:12px;border:1px solid #90caf9;border-radius:8px;background:#f7fbff;}
    .batch-row-number-title{display:block;color:#1976d2;font-weight:bold;margin-bottom:8px;}
    #four-gap-row-numbers{width:100%;min-height:90px;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:6px;font-size:15px;line-height:1.5;resize:vertical;}
    .batch-row-number-actions{display:flex;flex-direction:column;gap:7px;margin-top:8px;}
    .batch-row-number-actions button{margin-top:0;}
    .batch-division-results{margin-top:18px;}
    .batch-division-item{background:#fff;border:1px solid #90caf9;border-radius:8px;padding:12px 8px;margin-bottom:14px;overflow:hidden;}
    .batch-division-heading{color:#1976d2;font-weight:bold;font-size:16px;margin-bottom:8px;overflow-wrap:anywhere;}
</style>

<body>
<div id="global-loader"></div>
<div id="error-monitor"></div>
<header>Lucky Generator<div id="crypto-status">Motor: Bekleniyor...</div></header>
<div id="app"><div id="view-container"></div></div>
<div class="bottom-nav">
    <button id="nav-btn-generate">Üret</button>
    <button id="nav-btn-mySets">Kayıtlarım</button>
</div>
<div id="resultPanel">
    <h3 style="margin-top:0;">Sonuç Gir <span id="close-panel-btn" style="float:right;cursor:pointer;padding:5px;">×</span></h3>
    <div>
        <label for="bulkResultNumbers"><b>Sonuç Sayılarını Toplu Yapıştır</b></label>
        <textarea id="bulkResultNumbers" placeholder="Örnek: 1 2 5 10 12 14 24 28 30 31 32 33 39 47 48 53 66 68 71 74 76 77" aria-describedby="bulk-result-status"></textarea>
        <button type="button" id="btn-apply-bulk-results">Yapıştırılan Sayıları Renklendir</button>
        <div id="bulk-result-status" aria-live="polite"></div>
    </div>
    <div id="resultNumbers"></div>
    <div style="margin-top:15px;">
        <button id="btn-confirm-result">Tamamla</button>
        <button id="btn-clean-result" style="background:#999;margin-top:8px;">Tümünü Temizle</button>
    </div>
</div>
<input type="file" id="import-file-input" accept=".json" style="display:none;">
<script>
const getEl = (id) => document.getElementById(id);
const setLoading = (state) => { const el = getEl("global-loader"); if(el) el.style.display = state ? "block" : "none"; };
function toggleBodyScroll(lock) { document.body.classList.toggle("modal-open", Boolean(lock)); }

const ErrorHandler = {
    report: function(type, data) {
        console.error(`[${type}]`, data.message || data);
        const monitor = getEl("error-monitor");
        if(!monitor) return;
        const toast = document.createElement("div");
        toast.className = "error-toast";
        const strong = document.createElement("strong");
        strong.textContent = `[${type}]`;
        const br = document.createElement("br");
        const small = document.createElement("small");
        small.textContent = (data.message || String(data)).substring(0,100);
        toast.append(strong, br, small);
        toast.onclick = () => toast.remove();
        monitor.appendChild(toast);
        setTimeout(() => { if(toast.parentNode) toast.remove(); }, 6000);
    }
};

window.onerror = (message, source, lineno, colno, error) => { ErrorHandler.report("Runtime Error", {message, source, lineno, colno, error}); return false; };
window.onunhandledrejection = (event) => { ErrorHandler.report("Promise Error", {message: event.reason?.message || "Asenkron işlem başarısız"}); return false; };

const GENERATION_LIMITS = {max:1000, per:100, jokerMax:1000, jokerPer:100, count:1000};
let generatedSets = [], currentInputValues = null, inputDraftSaveQueue = Promise.resolve(), lastRequestId = 0, isProcessing = false, cryptoTimeout = null;
let panelPreviousState = null, panelDraft = null, panelDraftGroupId = null, panelSelectionLimits = null, panelBaseVersion = null;
let selectedFourGapGroupIds = new Set(), selectedFifthGapGroupId = "", fourGapAnalysisResults = null;

function escapeHTML(str) { if(!str) return ""; const p = document.createElement("p"); p.textContent = str; return p.innerHTML; }

function applyBulkResultNumbers() {
    if(!panelDraft || !panelSelectionLimits || !panelDraftGroupId || String(history.state?.groupId) !== panelDraftGroupId || history.state?.page !== "panel") return;
    const textarea = getEl("bulkResultNumbers"), status = getEl("bulk-result-status");
    if(!textarea || !status) return;
    const raw = textarea.value.trim();
    if(!raw) { status.textContent = "Lütfen sayı listesini yapıştırın."; return; }
    const tokens = raw.split(/[\s,;]+/).filter(Boolean), values = [];
    for(const token of tokens) {
        if(!/^\d+$/.test(token)) { status.textContent = `Geçersiz değer: "${token}". Yalnızca pozitif tam sayılar girin.`; return; }
        const value = Number(token);
        if(!Number.isSafeInteger(value) || value < 1) { status.textContent = `Geçersiz sayı: "${token}". Yalnızca pozitif tam sayılar girin.`; return; }
        values.push(value);
    }
    const uniqueValues = [...new Set(values)], mainMax = panelSelectionLimits.max;
    const mainValues = uniqueValues.filter(v => v <= mainMax), outOfRangeValues = uniqueValues.filter(v => v > mainMax);
    panelDraft.main = [...mainValues];
    document.querySelectorAll("#resultNumbers .ball").forEach(ball => {
        if(ball.classList.contains("joker")) return;
        ball.classList.toggle("result-selected", panelDraft.main.includes(Number(ball.textContent)));
    });
    const messages = [`${mainValues.length} ana sayı balonu renklendirildi.`];
    if(uniqueValues.length !== values.length) messages.push("Tekrarlanan sayılar bir kez değerlendirildi.");
    if(outOfRangeValues.length > 0) messages.push(`Ana sayı aralığı (${mainMax}) dışında kalan sayılar: ${outOfRangeValues.join(", ")}.`);
    const requiredMainCount = panelSelectionLimits.main;
    messages.push(mainValues.length !== requiredMainCount ? `Kaydetmek için tam ${requiredMainCount} ana sayı seçilmelidir.` : "Ana sayı adedi kayıt için uygun.");
    status.textContent = messages.join(" ");
}

const CryptoEngine = {
    isSecure: !!(window.crypto && window.crypto.getRandomValues),
    nextUint32: function(max) {
        if(!this.isSecure) throw new Error("GÜVENLİ MOTOR BULUNAMADI!");
        if(typeof max !== 'number' || !Number.isFinite(max) || max <= 0 || !Number.isInteger(max)) throw new Error("GEÇERSİZ MAKSİMUM DEĞER!");
        if(max <= 1) return 0;
        const buf = new Uint32Array(1), limit = Math.floor(0x100000000 / max) * max;
        let val;
        do { window.crypto.getRandomValues(buf); val = buf[0]; } while(val >= limit);
        return val % max;
    },
    updateUI: function() {
        const statusEl = getEl("crypto-status");
        if(!statusEl) return;
        if(cryptoTimeout) clearTimeout(cryptoTimeout);
        statusEl.innerHTML = `Motor: <span class="engine-badge">Web Crypto (Güvenli)</span>`;
        cryptoTimeout = setTimeout(() => { statusEl.innerHTML = `Motor: Bekleniyor...`; }, 10000);
    }
};

function secureShuffle(array) {
    for(let i = array.length - 1; i > 0; i--) { const j = CryptoEngine.nextUint32(i + 1); [array[i], array[j]] = [array[j], array[i]]; }
    CryptoEngine.updateUI();
    return array;
}

const DB_CONFIG = {name:"LuckyDB", version:4, storeName:"savedGroups", draftStore:"drafts", lockName:"db_write_lock"};
let dbInstance = null;

function getDB() {
    return new Promise((resolve, reject) => {
        if(dbInstance) return resolve(dbInstance);
        let settled = false;
        const fail = (e) => { if(!settled) { settled = true; reject(e instanceof Error ? e : new Error(String(e))); } };
        const succeed = (db) => { if(!settled) { settled = true; resolve(db); } };
        let req;
        try { req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version); } catch(e) { return fail(e); }
        req.onblocked = () => { alert("Lütfen diğer sekmeleri kapatın."); fail(new Error("DB Blocked")); };
        req.onupgradeneeded = (e) => {
            try {
                const db = e.target.result;
                if(!db.objectStoreNames.contains(DB_CONFIG.storeName)) db.createObjectStore(DB_CONFIG.storeName, {keyPath:"id"});
                if(!db.objectStoreNames.contains(DB_CONFIG.draftStore)) db.createObjectStore(DB_CONFIG.draftStore, {keyPath:"id"});
            } catch(err) { fail(err); }
        };
        req.onsuccess = () => { dbInstance = req.result; dbInstance.onversionchange = () => { dbInstance.close(); dbInstance = null; }; succeed(dbInstance); };
        req.onerror = () => fail(new Error("DB Hatası: " + (req.error ? req.error.message : "Bilinmeyen Hata")));
        req.onabort = () => fail(new Error("DB açma işlemi iptal edildi."));
    });
}

const cleanNumberArray = (arr) => Array.isArray(arr) ? arr.map(n => parseInt(n,10)).filter(n => Number.isInteger(n) && Number.isFinite(n) && n > 0) : [];
function validateNumberList(list, max) {
    if(!Array.isArray(list)) return [];
    const result = [];
    for(const n of list) { if(Number.isInteger(n) && Number.isFinite(n) && n > 0 && n <= max && !result.includes(n)) result.push(n); }
    return result;
}

const Validator = {
    validateGroup: (data) => {
        try {
            if(!data || typeof data !== 'object' || Array.isArray(data)) return null;
            const rawMax = Number(data.max), rawJokerMax = Number(data.jokerMax), rawJokerPerSet = Number(data.jokerPerSet);
            const max = Number.isInteger(rawMax) && rawMax > 0 ? rawMax : 49;
            const jokerMax = Number.isInteger(rawJokerMax) && rawJokerMax > 0 ? rawJokerMax : 0;
            const jokerPerSet = Number.isInteger(rawJokerPerSet) && rawJokerPerSet > 0 ? rawJokerPerSet : 0;
            const safeJokerPerSet = jokerMax > 0 ? Math.min(jokerPerSet, jokerMax) : 0;
            const validatedSets = Array.isArray(data.sets) ? data.sets.map(set => {
                if(!set || typeof set !== "object" || Array.isArray(set)) return null;
                const numbers = validateNumberList(cleanNumberArray(set.numbers), max);
                const jokers = jokerMax > 0 ? validateNumberList(cleanNumberArray(set.jokers), jokerMax) : [];
                return {numbers, jokers, max, jokerMax};
            }).filter(set => set && set.numbers.length > 0 && set.numbers.length <= max && !(jokerMax === 0 && set.jokers.length > 0) && !(safeJokerPerSet > 0 && set.jokers.length > safeJokerPerSet)) : [];
            const resultsMain = validateNumberList(cleanNumberArray(data.results?.main), max);
            const resultsJoker = jokerMax > 0 ? validateNumberList(cleanNumberArray(data.results?.joker), jokerMax) : [];
            const rawPerSet = Number(data.perSet);
            const perSet = Number.isInteger(rawPerSet) && rawPerSet > 0 && rawPerSet <= max ? rawPerSet : (Array.isArray(data.sets) && data.sets.length > 0 && Array.isArray(data.sets[0]?.numbers) ? data.sets[0].numbers.length : 5);
            const safePerSet = Math.min(perSet, max);
            const safeId = data.id !== undefined && data.id !== null && String(data.id).trim() !== "" ? String(data.id) : String(Date.now());
            const safeName = data.name !== undefined && data.name !== null && String(data.name).trim() !== "" ? String(data.name) : "İsimsiz Liste";
            const rawVersion = Number(data.version);
            return {id:safeId, name:safeName, sets:validatedSets, max, perSet:safePerSet, jokerMax, jokerPerSet:safeJokerPerSet, results:{main:resultsMain.slice(0,safePerSet), joker:safeJokerPerSet > 0 ? resultsJoker.slice(0,safeJokerPerSet) : []}, version:Number.isFinite(rawVersion) && rawVersion > 0 ? rawVersion : Date.now()};
        } catch(e) { return null; }
    }
};

let lockQueue = Promise.resolve();
async function withLock(workFn) {
    if(navigator.locks) return navigator.locks.request(DB_CONFIG.lockName, async () => await workFn());
    const currentLock = lockQueue.then(() => workFn());
    lockQueue = currentLock.catch(() => {});
    return currentLock;
}

function runTx(storeNames, mode, fn, errPrefix) {
    return new Promise((resolve, reject) => {
        let settled = false;
        const fail = (e) => { if(!settled) { settled = true; reject(e instanceof Error ? e : new Error(String(e))); } };
        const succeed = (v) => { if(!settled) { settled = true; resolve(v); } };
        getDB().then(db => {
            let tx;
            try { tx = db.transaction(storeNames, mode); } catch(e) { return fail(e); }
            tx.onerror = () => fail(tx.error || new Error(`${errPrefix} transaction hatası.`));
            tx.onabort = () => fail(tx.error || new Error(`${errPrefix} transaction iptal edildi.`));
            fn(tx, succeed, fail);
        }).catch(fail);
    });
}

async function getDraft(id) {
    try { return await runTx(DB_CONFIG.draftStore, "readonly", (tx, succeed, fail) => { const req = tx.objectStore(DB_CONFIG.draftStore).get(id); req.onsuccess = () => succeed(req.result); req.onerror = () => fail(req.error || new Error("Draft okuma hatası.")); }, "Draft"); }
    catch(e) { ErrorHandler.report("Draft Get Error", e); throw e; }
}
async function saveDraft(id, data) {
    try { await runTx(DB_CONFIG.draftStore, "readwrite", (tx, succeed, fail) => { try { tx.objectStore(DB_CONFIG.draftStore).put({id, data, ts:Date.now()}); tx.oncomplete = succeed; } catch(e) { fail(e); } }, "Draft yazma"); }
    catch(e) { ErrorHandler.report("Draft Save Error", e); throw e; }
}
async function deleteDraft(id) {
    try { await runTx(DB_CONFIG.draftStore, "readwrite", (tx, succeed, fail) => { try { tx.objectStore(DB_CONFIG.draftStore).delete(id); tx.oncomplete = succeed; } catch(e) { fail(e); } }, "Draft silme"); }
    catch(e) { ErrorHandler.report("Draft Delete Error", e); throw e; }
}
function queueInputDraftSave(values) {
    const savedValues = {...values};
    currentInputValues = {...savedValues};
    inputDraftSaveQueue = inputDraftSaveQueue.catch(() => {}).then(() => saveDraft("tempInputs", savedValues)).catch(e => ErrorHandler.report("Draft Save Error", e));
    return inputDraftSaveQueue;
}
async function getAllGroups() {
    try { return await runTx(DB_CONFIG.storeName, "readonly", (tx, succeed, fail) => { const req = tx.objectStore(DB_CONFIG.storeName).getAll(); req.onsuccess = (e) => succeed((e.target.result || []).map(Validator.validateGroup).filter(Boolean)); req.onerror = () => fail(req.error || new Error("Kayıtlar okunamadı.")); }, "DB okuma"); }
    catch(e) { ErrorHandler.report("Get All Groups Error", e); throw e; }
}
async function getGroupById(id) {
    if(!id) return null;
    try { return await runTx(DB_CONFIG.storeName, "readonly", (tx, succeed, fail) => { const req = tx.objectStore(DB_CONFIG.storeName).get(String(id)); req.onsuccess = (e) => succeed(Validator.validateGroup(e.target.result)); req.onerror = () => fail(req.error || new Error("Kayıt okunamadı.")); }, "DB"); }
    catch(e) { ErrorHandler.report("Get Group Error", e); return null; }
}

async function atomicSave(item, options = {}) {
    return withLock(async () => {
        const val = Validator.validateGroup(item);
        if(!val) throw new Error("Doğrulama hatası.");
        let conflict = false;
        await runTx(DB_CONFIG.storeName, "readwrite", (tx, succeed, fail) => {
            const store = tx.objectStore(DB_CONFIG.storeName), request = store.get(val.id);
            request.onsuccess = () => {
                const current = request.result;
                if(options.requireExisting && !current) { conflict = true; return fail(new Error("Kayıtlı liste başka bir sekmede silinmiş. Eski seçimler kaydedilmedi.")); }
                if(options.expectedVersion !== undefined && (!current || Number(current.version) !== Number(options.expectedVersion))) { conflict = true; return fail(new Error("Liste başka bir sekmede değiştirilmiş. Eski verinin üzerine yazılmadı.")); }
                val.version = Math.max(Date.now(), Number(current?.version || 0) + 1);
                try { store.put(val); tx.oncomplete = () => { if(!conflict) succeed(); }; } catch(e) { fail(e); try { tx.abort(); } catch(_) {} }
            };
            request.onerror = () => { fail(request.error || new Error("Kayıt kontrolü başarısız.")); try { tx.abort(); } catch(_) {} };
        }, "Yazma");
    });
}

async function atomicSaveGroupAndDeleteDraft(item, draftId) {
    return withLock(async () => {
        const val = Validator.validateGroup(item);
        if(!val) throw new Error("Doğrulama hatası.");
        await runTx([DB_CONFIG.storeName, DB_CONFIG.draftStore], "readwrite", (tx, succeed, fail) => {
            const groupStore = tx.objectStore(DB_CONFIG.storeName), draftStore = tx.objectStore(DB_CONFIG.draftStore), request = groupStore.get(val.id);
            request.onsuccess = () => {
                const current = request.result;
                val.version = Math.max(Date.now(), Number(current?.version || 0) + 1);
                try { groupStore.put(val); draftStore.delete(draftId); tx.oncomplete = succeed; } catch(e) { try { tx.abort(); } catch(_) {} fail(e); }
            };
            request.onerror = () => { try { tx.abort(); } catch(_) {} fail(request.error || new Error("Kayıt kontrolü başarısız.")); };
        }, "Grup kaydı ve taslak silme");
    });
}

async function deleteFromDB(id) {

function normalizeGeneratedSetsDraft(data) {
    if(!Array.isArray(data)) return [];
    const safeSets = [];
    for(const set of data) {
        if(!set || typeof set !== "object" || Array.isArray(set) || !Array.isArray(set.numbers) || !Array.isArray(set.jokers)) continue;
        const rawMax = Number(set.max), rawJokerMax = Number(set.jokerMax);
        if(!Number.isSafeInteger(rawMax) || rawMax < 1 || rawMax > GENERATION_LIMITS.max) continue;
        if(!Number.isSafeInteger(rawJokerMax) || rawJokerMax < 0 || rawJokerMax > GENERATION_LIMITS.jokerMax) continue;
        const numbers = validateNumberList(cleanNumberArray(set.numbers), rawMax);
        const jokers = rawJokerMax > 0 ? validateNumberList(cleanNumberArray(set.jokers), rawJokerMax) : [];
        if(numbers.length === 0 || numbers.length > GENERATION_LIMITS.per) continue;
        if(rawJokerMax === 0 && jokers.length > 0) continue;
        if(jokers.length > GENERATION_LIMITS.jokerPer) continue;
        safeSets.push({numbers, jokers, max:rawMax, jokerMax:rawJokerMax});
    }
    return safeSets;
}

function normalizeDraftInputs(data) {
    const defaults = {max:35, per:5, jMax:31, jPer:1, count:5};
    if(!data || typeof data !== "object" || Array.isArray(data)) return {...defaults};
    const readInt = (v) => { if(v === undefined || v === null || (typeof v === "string" && v.trim() === "")) return null; const n = Number(v); return Number.isSafeInteger(n) ? n : null; };
    const rawMax = readInt(data.max), max = rawMax !== null && rawMax >= 1 && rawMax <= GENERATION_LIMITS.max ? rawMax : defaults.max;
    const rawPer = readInt(data.per), per = rawPer !== null && rawPer >= 1 && rawPer <= GENERATION_LIMITS.per && rawPer <= max ? rawPer : Math.min(defaults.per, max);
    const rawJMax = readInt(data.jMax), jMax = rawJMax !== null && rawJMax >= 0 && rawJMax <= GENERATION_LIMITS.jokerMax ? rawJMax : defaults.jMax;
    const rawJPer = readInt(data.jPer), jPer = rawJPer !== null && rawJPer >= 0 && rawJPer <= GENERATION_LIMITS.jokerPer && (rawJPer === 0 || rawJPer <= jMax) ? rawJPer : Math.min(defaults.jPer, jMax);
    const rawCount = readInt(data.count), count = rawCount !== null && rawCount >= 1 && rawCount <= GENERATION_LIMITS.count ? rawCount : defaults.count;
    return {max, per, jMax, jPer, count};
}

async function generateSets() {
    if(isProcessing) return;
    const maxEl = getEl("maxNumber"), perEl = getEl("perSet"), jMaxEl = getEl("jokerMax"), jPerEl = getEl("jokerCount"), countEl = getEl("setCount");
    if(!maxEl || !perEl || !jMaxEl || !jPerEl || !countEl) return;
    const max = parseInt(maxEl.value,10)||0, per = parseInt(perEl.value,10)||0, jMax = parseInt(jMaxEl.value,10)||0, jPer = parseInt(jPerEl.value,10)||0, count = parseInt(countEl.value,10)||0;
    if(!Number.isSafeInteger(max) || !Number.isSafeInteger(per) || !Number.isSafeInteger(jMax) || !Number.isSafeInteger(jPer) || !Number.isSafeInteger(count) || max < 1 || max > GENERATION_LIMITS.max || per < 1 || per > GENERATION_LIMITS.per || per > max || jMax < 0 || jMax > GENERATION_LIMITS.jokerMax || jPer < 0 || jPer > GENERATION_LIMITS.jokerPer || (jPer > 0 && jMax < jPer) || count < 1 || count > GENERATION_LIMITS.count) {
        return alert(`Geçersiz üretim parametresi! Üst sınırlar: Ana maksimum ${GENERATION_LIMITS.max}, ana seçim ${GENERATION_LIMITS.per}, Joker maksimum ${GENERATION_LIMITS.jokerMax}, Joker seçim ${GENERATION_LIMITS.jokerPer}, kolon ${GENERATION_LIMITS.count}.`);
    }
    try {
        setLoading(true); isProcessing = true;
        const newGeneratedSets = [];
        for(let i = 0; i < count; i++) {
            const mainPool = Array.from({length:max}, (_,k) => k+1);
            const n = secureShuffle([...mainPool]).slice(0,per).sort((a,b) => a-b);
            let j = [];
            if(jMax > 0 && jPer > 0) { const jokerPool = Array.from({length:jMax}, (_,k) => k+1); j = secureShuffle([...jokerPool]).slice(0,jPer).sort((a,b) => a-b); }
            newGeneratedSets.push({numbers:n, jokers:j, max, jokerMax:jMax});
        }
        await saveDraft("tempSets", newGeneratedSets);
        await queueInputDraftSave({max, per, jMax, jPer, count});
        generatedSets = newGeneratedSets; currentInputValues = {max, per, jMax, jPer, count};
        renderGeneratedSetsList();
    } catch(e) { ErrorHandler.report("Generate Error", e); }
    finally { setLoading(false); isProcessing = false; }
}

function findFourNonBlueRuns(group, rowNumber) {
    const matchingGroups = [];
    if(!group || !Array.isArray(group.sets) || !group.results || !Array.isArray(group.results.main) || !Number.isInteger(rowNumber) || rowNumber < 1) return matchingGroups;
    const resultNumbers = new Set(group.results.main.map(Number)), totalColumns = Math.min(group.sets.length, 1000);
    let pendingColumns = [], previousBlue = false;
    for(let index = 0; index < totalColumns; index++) {
        const set = group.sets[index];
        if(!set || !Array.isArray(set.numbers) || set.numbers.length < rowNumber) { pendingColumns = []; previousBlue = false; continue; }
        const selectedBallNumber = Number(set.numbers[rowNumber - 1]);
        if(!Number.isFinite(selectedBallNumber)) { pendingColumns = []; previousBlue = false; continue; }
        const isBlue = resultNumbers.has(selectedBallNumber), columnNumber = index + 100;
        if(isBlue) { if(previousBlue && pendingColumns.length === 4) matchingGroups.push([...pendingColumns]); pendingColumns = []; previousBlue = true; }
        else if(previousBlue) pendingColumns.push(columnNumber);
    }
    return matchingGroups;
}

function getDivisionIntegerGroups(value) { if(value === null || value === undefined) return []; return (String(value).split(".")[0] || "0").match(/.{1,3}/g) || []; }

function findFifthListMatches(average, fifthGroup, rowNumber) {
    if(average === null || average === undefined || !fifthGroup || !Array.isArray(fifthGroup.sets)) return [];
    return getDivisionIntegerGroups(average).slice(0,4).map(groupNumber => {
        if(!/^\d{3}$/.test(groupNumber)) return {targetNumber:groupNumber, found:false, message:"3 haneli değil"};
        const targetColumnNumber = Number(groupNumber), targetIndex = targetColumnNumber - 100, totalColumns = Math.min(fifthGroup.sets.length, 1000);
        if(!Number.isSafeInteger(targetColumnNumber) || targetColumnNumber < 100 || targetIndex < 0 || targetIndex >= totalColumns) return {targetNumber:groupNumber, found:false, message:"Kolon bulunamadı"};
        const targetSet = fifthGroup.sets[targetIndex];
        if(!targetSet || !Array.isArray(targetSet.numbers) || targetSet.numbers.length < rowNumber) return {targetNumber:groupNumber, found:false, message:"Gri sıra bulunamadı"};
        const ballValue = Number(targetSet.numbers[rowNumber - 1]);
        if(!Number.isFinite(ballValue)) return {targetNumber:groupNumber, found:false, message:"Balon bulunamadı"};
        return {targetNumber:groupNumber, columnNumber:targetColumnNumber, rowNumber, ballValue, isResult:Array.isArray(fifthGroup.results?.main) && fifthGroup.results.main.includes(ballValue), found:true};
    });
}

function createTransferredBallDisplay(match, rowNumber) {
    const wrapper = document.createElement("div"); wrapper.className = "division-transfer-group";
    if(!match || !match.found) { const s = document.createElement("span"); s.className = "division-transferred-status"; s.textContent = match?.message || "Eşleşme yok"; wrapper.appendChild(s); return wrapper; }
    const order = document.createElement("span"); order.className = "ball-order"; order.textContent = String(match.columnNumber);
    const index = document.createElement("span"); index.className = "ball-index"; index.textContent = String(rowNumber);
    const ball = document.createElement("div"); ball.className = "division-transferred-ball"; ball.textContent = String(match.ballValue);
    if(match.isResult) ball.classList.add("result-selected");
    const status = document.createElement("span"); status.className = "division-transferred-status"; status.textContent = match.isResult ? "Mavi sonuç" : "Mavi değil";
    wrapper.append(order, index, ball, status); return wrapper;
}

function computeAvgString(total, count) {
    if(count <= 0) return null;
    const divisor = BigInt(count), scale = 1000000n, scaled = (total * scale + divisor / 2n) / divisor;
    const whole = scaled / scale, fraction = (scaled % scale).toString().padStart(6, "0").replace(/0+$/, "");
    return fraction ? `${whole}.${fraction}` : whole.toString();
}

async function runFourSelectedListsAnalysis() {
    if(selectedFourGapGroupIds.size !== 4) return alert("Karşılaştırma için tam olarak dört liste seçmelisin.");
    if(!selectedFifthGapGroupId) return alert("Lütfen dört karşılaştırma listesinden farklı bir beşinci liste seç.");
    if(selectedFourGapGroupIds.has(String(selectedFifthGapGroupId))) return alert("Beşinci liste, seçilen dört listeden farklı olmalıdır.");
    const rowNumberInput = getEl("four-gap-row-number"); if(!rowNumberInput) return alert("Gri balon sıra numarası giriş alanı bulunamadı.");
    const rowNumber = Number(rowNumberInput.value);
    if(!Number.isSafeInteger(rowNumber) || rowNumber < 1 || rowNumber > 100) { alert("Lütfen 1 ile 100 arasında geçerli bir gri balon sıra numarası gir."); rowNumberInput.focus(); return; }
    try {
        setLoading(true);
        const groups = await getAllGroups(), groupsById = new Map(groups.map(g => [String(g.id), g])), selectedGroups = [];
        for(const id of selectedFourGapGroupIds) {
            const group = groupsById.get(String(id));
            if(!group) { selectedFourGapGroupIds.delete(String(id)); throw new Error("Seçilen listelerden biri artık kayıtlı değil. Listeleri yeniden seç."); }
            const totalColumns = Math.min(group.sets.length, 1000);
            if(totalColumns === 0) throw new Error(`"${group.name}" listesinde incelenecek kolon bulunamadı.`);
            for(let index = 0; index < totalColumns; index++) {
                const set = group.sets[index];
                if(!set || !Array.isArray(set.numbers) || set.numbers.length < rowNumber || !Number.isFinite(Number(set.numbers[rowNumber - 1]))) throw new Error(`"${group.name}" listesinde ${index + 1}. kolonda gri ${rowNumber} sıra numaralı ana balon bulunamadı. Karşılaştırma başlatılmadı.`);
            }
            selectedGroups.push(group);
        }
        const fifthGroup = groupsById.get(String(selectedFifthGapGroupId));
        if(!fifthGroup) { selectedFifthGapGroupId = ""; throw new Error("Seçilen beşinci liste artık kayıtlı değil. Lütfen yeniden seç."); }
        if(selectedFourGapGroupIds.has(String(fifthGroup.id))) throw new Error("Beşinci liste dört karşılaştırma listesinden biriyle aynı olamaz.");
        if(Math.min(fifthGroup.sets.length, 1000) === 0) throw new Error(`"${fifthGroup.name}" beşinci listesinde kolon bulunamadı.`);
        const results = selectedGroups.map(group => ({id:String(group.id), name:group.name, rowNumber, matches:findFourNonBlueRuns(group, rowNumber)})), allSequences = [];
        results.forEach(r => r.matches.forEach(seq => { const joined = seq.join(""); if(/^\d+$/.test(joined)) allSequences.push({listName:r.name, sequence:joined, value:BigInt(joined)}); }));
        let total = 0n; allSequences.forEach(item => { total += item.value; });
        const count = allSequences.length, average = computeAvgString(total, count), fifthMatches = findFifthListMatches(average, fifthGroup, rowNumber);
        fourGapAnalysisResults = {rowNumber, results, allSequences, total:total.toString(), count, average, fifthGroupId:String(fifthGroup.id), fifthGroupName:fifthGroup.name, fifthGroup, fifthMatches};
        const output = renderFourGapAnalysisResults(fourGapAnalysisResults), oldOutput = getEl("four-gap-analysis-output");
        if(oldOutput) oldOutput.replaceWith(output); else { const selCard = document.querySelector(".four-gap-select-card"); if(selCard) selCard.after(output); }
        output.scrollIntoView({behavior:"smooth", block:"start"});
    } catch(e) { ErrorHandler.report("Four Lists Analysis Error", e); alert(e?.message || "Dört liste karşılaştırılamadı."); }
    finally { setLoading(false); }
}

async function getSelectedAnalysisGroups() {
    if(selectedFourGapGroupIds.size !== 4) throw new Error("Toplu hesaplama için tam olarak dört liste seçmelisin.");
    if(!selectedFifthGapGroupId) throw new Error("Lütfen dört karşılaştırma listesinden farklı bir beşinci liste seç.");
    if(selectedFourGapGroupIds.has(String(selectedFifthGapGroupId))) throw new Error("Beşinci liste, seçilen dört listeden farklı olmalıdır.");
    const groups = await getAllGroups(), groupsById = new Map(groups.map(g => [String(g.id), g])), selectedGroups = [];
    for(const id of selectedFourGapGroupIds) {
        const group = groupsById.get(String(id));
        if(!group) throw new Error("Seçilen dört listeden biri artık kayıtlı değil. Listeleri yeniden seç.");
        if(!Array.isArray(group.sets) || group.sets.length === 0) throw new Error(`"${group.name}" listesinde kolon bulunamadı.`);
        selectedGroups.push(group);
    }
    const fifthGroup = groupsById.get(String(selectedFifthGapGroupId));
    if(!fifthGroup) throw new Error("Seçilen beşinci liste artık kayıtlı değil. Lütfen yeniden seç.");
    if(selectedFourGapGroupIds.has(String(fifthGroup.id))) throw new Error("Beşinci liste, dört karşılaştırma listesinden farklı olmalıdır.");
    if(!Array.isArray(fifthGroup.sets) || fifthGroup.sets.length === 0) throw new Error(`"${fifthGroup.name}" beşinci listesinde kolon bulunamadı.`);
    return {selectedGroups, fifthGroup};
}

async function autoFillAvailableRowNumbers() {
    const input = getEl("four-gap-row-numbers"), status = getEl("batch-row-number-status");
    if(!input) return;
    try {
        setLoading(true);
        const {selectedGroups} = await getSelectedAnalysisGroups();
        let commonRowCount = 100;
        selectedGroups.forEach(group => {
            const totalColumns = Math.min(group.sets.length, 1000);
            for(let index = 0; index < totalColumns; index++) { const set = group.sets[index]; commonRowCount = Math.min(commonRowCount, set && Array.isArray(set.numbers) ? set.numbers.length : 0); }
        });
        if(commonRowCount < 1) throw new Error("Seçilen dört listede ortak kullanılabilir gri sıra numarası bulunamadı.");
        const rowNumbers = Array.from({length:commonRowCount}, (_,i) => i+1);
        input.value = rowNumbers.join(", ");
        if(status) status.textContent = `${rowNumbers.length} ortak gri sıra numarası otomatik dolduruldu. İstersen numaraları düzenleyebilirsin.`;
    } catch(e) { if(status) status.textContent = ""; alert(e?.message || "Ortak sıra numaraları belirlenemedi."); }
    finally { setLoading(false); }
}

function calculateBatchAverage(selectedGroups, fifthGroup, rowNumber) {
    const allSequences = [];
    selectedGroups.forEach(group => findFourNonBlueRuns(group, rowNumber).forEach(seq => { const joined = seq.join(""); if(/^\d+$/.test(joined)) allSequences.push({listName:group.name, sequence:joined, value:BigInt(joined)}); }));
    let total = 0n; allSequences.forEach(item => { total += item.value; });
    const count = allSequences.length, average = computeAvgString(total, count);
    return {rowNumber, count, total:total.toString(), average, fifthMatches:findFifthListMatches(average, fifthGroup, rowNumber)};
}

async function runBatchRowAnalysis() {
    const input = getEl("four-gap-row-numbers"), status = getEl("batch-row-number-status");
    if(!input) return alert("Toplu sıra numarası alanı bulunamadı.");
    const rawValues = input.value.split(/[\s,;]+/).map(v => v.trim()).filter(Boolean), rowNumbers = [], seen = new Set();
    for(const value of rawValues) {
        if(!/^\d+$/.test(value)) return alert(`Geçersiz sıra numarası: ${value}`);
        const number = Number(value);
        if(!Number.isSafeInteger(number) || number < 1 || number > 100) return alert("Gri sıra numaraları 1 ile 100 arasında olmalıdır.");
        if(!seen.has(number)) { seen.add(number); rowNumbers.push(number); }
    }
    if(rowNumbers.length === 0) return alert("Lütfen hesaplanacak en az bir gri sıra numarası gir veya otomatik doldur.");
    try {
        setLoading(true);
        const {selectedGroups, fifthGroup} = await getSelectedAnalysisGroups();
        selectedGroups.forEach(group => {
            const totalColumns = Math.min(group.sets.length, 1000);
            rowNumbers.forEach(rowNumber => {
                for(let index = 0; index < totalColumns; index++) {
                    const set = group.sets[index];
                    if(!set || !Array.isArray(set.numbers) || set.numbers.length < rowNumber || !Number.isFinite(Number(set.numbers[rowNumber - 1]))) throw new Error(`"${group.name}" listesinde ${index + 1}. kolonda gri ${rowNumber} sıra numaralı ana balon bulunamadı. Toplu hesaplama başlatılmadı.`);
                }
            });
        });
        const results = rowNumbers.map(rn => calculateBatchAverage(selectedGroups, fifthGroup, rn));
        const output = document.createElement("div"); output.id = "batch-division-results"; output.className = "batch-division-results";
        const heading = document.createElement("div"); heading.className = "four-gap-average-title"; heading.textContent = "Toplu Sıra Numarası Hesaplama Sonuçları"; output.appendChild(heading);
        results.forEach(result => {
            const item = document.createElement("div"); item.className = "batch-division-item";
            const itemHeading = document.createElement("div"); itemHeading.className = "batch-division-heading"; itemHeading.textContent = `Gri sıra numarası: ${result.rowNumber}`; item.appendChild(itemHeading);
            if(result.average === null) { const empty = document.createElement("p"); empty.className = "four-gap-empty"; empty.textContent = "Bu sıra numarası için hesaplamaya uygun sayı dizisi bulunamadı."; item.appendChild(empty); }
            else {
                const avgInfo = document.createElement("div"); avgInfo.className = "parity-result-number"; avgInfo.textContent = `Ortalama: ${result.total} ÷ ${result.count} = ${result.average}`;
                item.append(avgInfo, createDivisionResultDisplay(result.average, result.fifthMatches, result.rowNumber, `Gri ${result.rowNumber} Sıra Numarasının Bölme Sonucu ve Beşinci Liste Eşleşmeleri`));
            }
            output.appendChild(item);
        });
        const oldOutput = getEl("batch-division-results");
        if(oldOutput) oldOutput.replaceWith(output); else { const selCard = document.querySelector(".four-gap-select-card"); if(selCard) selCard.after(output); }
        if(status) status.textContent = `${results.length} sıra numarası ayrı ayrı hesaplandı.`;
        output.scrollIntoView({behavior:"smooth", block:"start"});
    } catch(e) { ErrorHandler.report("Batch Row Analysis Error", e); alert(e?.message || "Toplu hesaplama tamamlanamadı."); }
    finally { setLoading(false); }
}

    const result = String(value), parts = result.split("."), integerPart = parts[0] || "0", decimalPart = parts.length > 1 ? parts.slice(1).join(".") : "";

    data.results.forEach((result, index) => {
        const listTitle = document.createElement("div"); listTitle.className = "four-gap-list-title"; listTitle.textContent = `${index + 1}. Liste: ${result.name}`; card.appendChild(listTitle);
        if(!result.matches || result.matches.length === 0) { const msg = document.createElement("p"); msg.className = "four-gap-empty"; msg.textContent = `İlk 1000 kolon içinde iki mavi ${rowNumber} sıra numaralı balon arasında tam olarak dört mavi olmayan ${rowNumber} sıra numaralı balon bulunamadı.`; card.appendChild(msg); return; }
        result.matches.forEach(numbers => { const row = document.createElement("div"); row.className = "four-gap-row"; const span = document.createElement("span"); span.className = "four-gap-number"; span.textContent = numbers.join(""); row.appendChild(span); card.appendChild(row); });
    });
    card.appendChild(renderParityResults(data.allSequences || [], data.fifthGroup || null, rowNumber));
    return card;
}

async function renderViewGroup(group, reqId) {
    const view = getEl("view-container");
    if(!view || reqId !== lastRequestId) return;
    const container = document.createElement("div"); container.className = "container";
    container.innerHTML = `<h3>${escapeHTML(group.name)}</h3>`;
    const hasRes = group.results.main.length > 0 || group.results.joker.length > 0;
    const resCard = document.createElement("div"); resCard.className = "card";
    resCard.innerHTML = `<b>Çıkan Sonuçlar:</b><div style="margin:10px 0;font-family:monospace;background:#f0f0f0;padding:5px;border-radius:4px;">${hasRes ? 'Ana: ' + [...group.results.main].sort((a,b)=>a-b).join(', ') : 'Girilmedi'}<br>${group.jokerPerSet > 0 ? 'Joker: ' + (group.results.joker.length ? [...group.results.joker].sort((a,b)=>a-b).join(', ') : '-') : ''}</div>`;
    const openBtn = document.createElement("button"); openBtn.textContent = "Sonuçları Gir"; openBtn.onclick = () => openResultPanel(group.max, group.id);
    resCard.appendChild(openBtn); container.appendChild(resCard);
    group.sets.forEach((set, i) => { const setCard = document.createElement("div"); setCard.className = "card"; setCard.innerHTML = `<b>${i+1}. Kolon</b>`; setCard.appendChild(createBallsUI(set, group.results, i+1)); container.appendChild(setCard); });
    const backBtn = document.createElement("button"); backBtn.textContent = "Geri Dön"; backBtn.style.background = "#666"; backBtn.onclick = () => navTo("mySets");
    container.appendChild(backBtn); view.innerHTML = ""; view.appendChild(container);
}

function createBallsUI(set, results = null, columnNumber = null) {
    const row = document.createElement("div"); row.className = "ball-row";
    let sequenceNumber = 0;
    const appendBall = (val, isJoker) => {
        sequenceNumber++;
        const item = document.createElement("div"); item.className = "ball-item";
        const order = document.createElement("div"); order.className = "ball-order"; if(!isJoker && columnNumber !== null) order.textContent = columnNumber + 99;
        const ballIndex = document.createElement("div"); ballIndex.className = "ball-index"; ballIndex.textContent = sequenceNumber;
        const ball = document.createElement("div"); ball.className = isJoker ? "ball joker" : "ball selected";
        if(results && (isJoker ? results.joker.includes(Number(val)) : results.main.includes(Number(val)))) ball.classList.add("result-selected");
        ball.textContent = val;
        item.append(order, ballIndex, ball); row.appendChild(item);
    };
    set.numbers.forEach(n => appendBall(n, false));
    set.jokers.forEach(j => appendBall(j, true));
    return row;
}

async function openResultPanel(max, groupId, shouldPushState = true) {
    const requestId = lastRequestId, requestedGroupId = String(groupId), group = await getGroupById(groupId);
    if(requestId !== lastRequestId || String(history.state?.groupId) !== requestedGroupId || (shouldPushState && history.state?.page !== "mySets") || !group) return;
    const targetMax = max || group.max, resDiv = getEl("resultNumbers"), bulkTextarea = getEl("bulkResultNumbers"), bulkStatus = getEl("bulk-result-status");
    if(!resDiv) return;
    panelDraft = {main:[...group.results.main], joker:[...group.results.joker]};
    panelDraftGroupId = requestedGroupId; panelBaseVersion = group.version;
    panelSelectionLimits = {main:group.perSet, joker:group.jokerPerSet, max:targetMax, jokerMax:group.jokerMax};
    resDiv.innerHTML = "";
    if(bulkTextarea) bulkTextarea.value = "";
    if(bulkStatus) bulkStatus.textContent = "";
    const createRow = (title, limit, isJoker) => {
        const h = document.createElement("h4"); h.textContent = title; h.style.margin = "15px 0 5px 0";
        const row = document.createElement("div"); row.className = "ball-row";
        for(let i = 1; i <= limit; i++) {
            const ball = document.createElement("div"); ball.className = "ball" + (isJoker ? " joker" : "");
            if((isJoker ? panelDraft.joker : panelDraft.main).includes(i)) ball.classList.add("result-selected");
            ball.textContent = i; ball.onclick = () => toggleResult(ball, requestedGroupId, i, isJoker); row.appendChild(ball);
        }
        resDiv.append(h, row);
    };
    createRow(`Ana Sayılar (1-${targetMax})`, targetMax, false);
    if(group.jokerPerSet > 0) createRow(`Joker Sayılar (1-${group.jokerMax})`, group.jokerMax, true);
    if(shouldPushState) {
        if(requestId !== lastRequestId) return;
        const cs = history.state;
        panelPreviousState = cs && cs.page === "mySets" && cs.groupId != null && String(cs.groupId) === requestedGroupId ? {page:"mySets", groupId:requestedGroupId} : null;
        history.pushState({page:"panel", groupId:requestedGroupId}, "");
    }
    if(String(history.state?.groupId) !== requestedGroupId) { panelDraft = null; panelDraftGroupId = null; panelSelectionLimits = null; panelBaseVersion = null; panelPreviousState = null; return; }
    getEl("resultPanel").style.display = "block"; toggleBodyScroll(true);
}

function toggleResult(el, id, val, isJoker) {
    if(!panelDraft || !panelSelectionLimits || panelDraftGroupId !== String(id)) return;
    const list = isJoker ? panelDraft.joker : panelDraft.main, limit = isJoker ? panelSelectionLimits.joker : panelSelectionLimits.main, max = isJoker ? panelSelectionLimits.jokerMax : panelSelectionLimits.max;
    if(val < 1 || val > max) return;
    const index = list.indexOf(val);
    if(index !== -1) { list.splice(index,1); el.classList.remove("result-selected"); }
    else { if(list.length >= limit) return alert(isJoker ? `En fazla ${limit} joker sayısı seçebilirsiniz!` : `En fazla ${limit} ana sayı seçebilirsiniz!`); list.push(val); el.classList.add("result-selected"); }
    const status = getEl("bulk-result-status");
    if(status) status.textContent = `Ana sayı seçimi: ${panelDraft.main.length}/${panelSelectionLimits.main}. Joker sayı seçimi: ${panelDraft.joker.length}/${panelSelectionLimits.joker}.`;
}

async function deleteGroup(id) {
    if(isProcessing || !confirm("Silinsin?")) return;
    try { setLoading(true); isProcessing = true; await deleteFromDB(id); selectedFourGapGroupIds.delete(String(id)); if(String(selectedFifthGapGroupId) === String(id)) selectedFifthGapGroupId = ""; fourGapAnalysisResults = null; await renderMySetsList(lastRequestId); }
    catch(e) { ErrorHandler.report("Delete Error", e); }
    finally { setLoading(false); isProcessing = false; }
}

function resetBulkPanelUI() {
    const bulkTextarea = getEl("bulkResultNumbers"), bulkStatus = getEl("bulk-result-status");
    if(bulkTextarea) bulkTextarea.value = "";
    if(bulkStatus) bulkStatus.textContent = "";
}

function closeResultPanel(forceBack = true) {
    const currentState = history.state, isPanelState = currentState && currentState.page === "panel";
    const panel = getEl("resultPanel"); if(panel) panel.style.display = "none";
    toggleBodyScroll(false);
    panelDraft = null; panelDraftGroupId = null; panelSelectionLimits = null; panelBaseVersion = null;
    resetBulkPanelUI();
    if(forceBack && isPanelState) {
        const currentGroupId = String(currentState.groupId), previousState = panelPreviousState; panelPreviousState = null;
        if(previousState && previousState.page === "mySets" && String(previousState.groupId) === currentGroupId) history.back();
        else { history.replaceState({page:"mySets", groupId:currentGroupId}, ""); renderCurrentState("mySets", currentGroupId); }
    }
}

async function confirmResult() {
    const id = panelDraftGroupId, expectedVersion = panelBaseVersion;
    if(isProcessing || !id || expectedVersion === null || expectedVersion === undefined || !panelDraft || !panelSelectionLimits || String(history.state?.groupId) !== id) return;
    const mainSelection = [...panelDraft.main], jokerSelection = [...panelDraft.joker];
    try {
        setLoading(true); isProcessing = true;
        const group = await getGroupById(id);
        if(!group) throw new Error("Kayıtlı liste bulunamadı veya başka bir sekmede silinmiş.");
        if(Number(group.version) !== Number(expectedVersion)) throw new Error("Liste başka bir sekmede değiştirilmiş. Eski seçimler kaydedilmedi. Listeyi yeniden açıp kontrol edin.");
        if(mainSelection.length !== group.perSet) { alert(`Tamamlamak için tam ${group.perSet} ana sayı seçmelisiniz. Şu anda ${mainSelection.length} ana sayı seçtiniz.`); return; }
        if(jokerSelection.length !== group.jokerPerSet) { alert(`Tamamlamak için tam ${group.jokerPerSet} joker sayısı seçmelisiniz. Şu anda ${jokerSelection.length} joker sayısı seçtiniz.`); return; }
        group.results = {main:mainSelection, joker:jokerSelection};
        await atomicSave(group, {expectedVersion, requireExisting:true});
        panelDraft = null; panelDraftGroupId = null; panelSelectionLimits = null; panelBaseVersion = null;
        const panel = getEl("resultPanel"); if(panel) panel.style.display = "none";
        toggleBodyScroll(false); resetBulkPanelUI(); panelPreviousState = null;
        history.replaceState({page:"mySets", groupId:id}, "");
        await renderCurrentState("mySets", id);
    } catch(e) { ErrorHandler.report("Confirm Result Error", e); alert((e?.message || "Sonuçlar kaydedilemedi.") + "\n\nPanel kapatılmadı. Listeyi yeniden açarak güncel veriyi kontrol edin."); }
    finally { setLoading(false); isProcessing = false; }
}

function cleanResult() {
    if(isProcessing || !panelDraft || !panelDraftGroupId || String(history.state?.groupId) !== panelDraftGroupId || !confirm("Seçimler temizlensin mi?")) return;
    panelDraft.main = []; panelDraft.joker = [];
    document.querySelectorAll("#resultNumbers .ball").forEach(ball => ball.classList.remove("result-selected"));
    resetBulkPanelUI();
    const bulkStatus = getEl("bulk-result-status"); if(bulkStatus) bulkStatus.textContent = "Tüm ana sayı ve joker seçimleri temizlendi.";
}

async function clearGeneratedSets() {
    if(isProcessing || !confirm("Üretilen tüm kolonlar temizlensin mi?")) return;
    try { isProcessing = true; await deleteDraft("tempSets"); generatedSets = []; renderGeneratedSetsList(); }
    catch(e) { ErrorHandler.report("Clear Drafts Error", e); }
    finally { isProcessing = false; }
}
</script>
</body>
</html>
