<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Generator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ball { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: all 0.2s; }
        .ball-main { background: #f0f0f0; border: 1px solid #ddd; color: #333; }
        .ball-selected { background: #1976d2 !important; color: white !important; border: none; }
        .ball-joker { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; }
        .ball-joker-selected { background: #f44336 !important; color: white !important; border: none; }
        body { padding-bottom: 80px; background-color: #f2f6fb; }
    </style>
</head>
<body>

<div id="root"></div>

<script>
/**
 * STATE MANAGEMENT (Durum Yönetimi)
 * Veriyi merkezi bir objede tutuyoruz. Her değişimde 'render()' tetiklenir.
 */
let state = {
    currentPage: 'generate',
    activeGroupId: null,
    tempInputs: JSON.parse(localStorage.getItem("tempInputs")) || { max: 35, per: 5, jMax: 31, jPer: 1, count: 5 },
    generatedSets: [],
    savedGroups: JSON.parse(localStorage.getItem("savedGroups")) || [],
    isPanelOpen: false
};

// State Güncelleme Fonksiyonu (Zustand/Redux mantığı)
function setState(newState) {
    state = { ...state, ...newState };
    // Verileri kalıcı depolamaya kaydet
    localStorage.setItem("savedGroups", JSON.stringify(state.savedGroups));
    localStorage.setItem("tempInputs", JSON.stringify(state.tempInputs));
    render();
}

/**
 * UTILS (Yardımcı Fonksiyonlar)
 */
const utils = {
    secureRandom: (max) => {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] % max;
    },
    shuffle: (array) => {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = utils.secureRandom(i + 1);
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    },
    copy: (text) => {
        navigator.clipboard.writeText(text).then(() => alert("Kopyalandı!"));
    }
};

/**
 * ACTIONS (İş Mantığı)
 */
const actions = {
    generate: () => {
        const { max, per, jMax, jPer, count } = state.tempInputs;
        const newSets = Array.from({ length: count }, () => {
            const mainPool = Array.from({ length: max }, (_, i) => i + 1);
            const jokerPool = Array.from({ length: jMax }, (_, i) => i + 1);
            return {
                numbers: utils.shuffle(mainPool).slice(0, per).sort((a, b) => a - b),
                jokers: utils.shuffle(jokerPool).slice(0, jPer).sort((a, b) => a - b)
            };
        });
        setState({ generatedSets: newSets });
    },
    save: (name) => {
        if (!name.trim()) return alert("İsim gerekli!");
        const newGroup = {
            id: Date.now().toString(),
            name,
            sets: state.generatedSets,
            config: { ...state.tempInputs },
            results: { main: [], joker: [] }
        };
        setState({ 
            savedGroups: [...state.savedGroups, newGroup], 
            generatedSets: [],
            currentPage: 'mySets' 
        });
    },
    delete: (id) => {
        if(confirm("Silmek istediğinize emin misiniz?")) {
            setState({ savedGroups: state.savedGroups.filter(g => g.id !== id) });
        }
    },
    toggleResult: (id, type, val) => {
        const groups = [...state.savedGroups];
        const g = groups.find(x => x.id === id);
        const list = g.results[type];
        const idx = list.indexOf(val);
        
        if (idx > -1) list.splice(idx, 1);
        else list.push(val);
        
        setState({ savedGroups: groups });
    }
};

/**
 * COMPONENTS (Bileşenler)
 * HTML'i string olarak değil, birer fonksiyonel parça olarak ele alıyoruz.
 */

const Header = () => `
    <header class="bg-blue-600 text-white p-5 text-center text-xl font-bold shadow-md">
        Lucky Generator Pro
    </header>
`;

const Ball = (num, type = 'main', isSelected = false) => {
    const baseClass = "ball";
    const typeClass = type === 'main' 
        ? (isSelected ? 'ball-selected' : 'ball-main') 
        : (isSelected ? 'ball-joker-selected' : 'ball-joker');
    
    // UI'daki tıklama aksiyonu direkt state'e bağlıdır
    const clickAttr = state.isPanelOpen ? `onclick="actions.toggleResult('${state.activeGroupId}', '${type}', ${num})"` : "";
    
    return `<div class="${baseClass} ${typeClass} cursor-pointer" ${clickAttr}>${num}</div>`;
};

const GeneratePage = () => `
    <div class="p-5 max-w-md mx-auto">
        <div class="bg-white p-5 rounded-xl shadow-sm mb-5 border border-gray-100">
            <h3 class="font-bold text-blue-700 mb-4">Üretim Ayarları</h3>
            <div class="space-y-3">
                <input type="number" placeholder="Havuz (Örn: 35)" class="w-full p-2 border rounded" value="${state.tempInputs.max}" onchange="state.tempInputs.max = parseInt(this.value)">
                <input type="number" placeholder="Seçilecek (Örn: 5)" class="w-full p-2 border rounded" value="${state.tempInputs.per}" onchange="state.tempInputs.per = parseInt(this.value)">
                <div class="border-t pt-2"></div>
                <input type="number" placeholder="Joker Havuzu" class="w-full p-2 border rounded" value="${state.tempInputs.jMax}" onchange="state.tempInputs.jMax = parseInt(this.value)">
                <input type="number" placeholder="Joker Sayısı" class="w-full p-2 border rounded" value="${state.tempInputs.jPer}" onchange="state.tempInputs.jPer = parseInt(this.value)">
                <div class="border-t pt-2"></div>
                <input type="number" placeholder="Kolon Sayısı" class="w-full p-2 border rounded" value="${state.tempInputs.count}" onchange="state.tempInputs.count = parseInt(this.value)">
                <button onclick="actions.generate()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">KOLONLARI ÜRET</button>
            </div>
        </div>
        <div id="results-area">
            ${state.generatedSets.map((set, i) => `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-3">
                    <b class="text-blue-600 block mb-2">${i+1}. Kolon</b>
                    <div class="flex flex-wrap gap-2">
                        ${set.numbers.map(n => Ball(n, 'main', true)).join('')}
                        ${set.jokers.map(j => Ball(j, 'joker', true)).join('')}
                    </div>
                </div>
            `).join('')}
            ${state.generatedSets.length > 0 ? `
                <div class="bg-white p-4 rounded-xl shadow-sm border-2 border-green-100">
                    <input type="text" id="gName" placeholder="Grup Adı (Örn: Süper Loto)" class="w-full p-2 border rounded mb-2">
                    <button onclick="actions.save(document.getElementById('gName').value)" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">LİSTEYİ KAYDET</button>
                </div>
            ` : ''}
        </div>
    </div>
`;

const MySetsPage = () => {
    if (state.activeGroupId) return GroupDetails(state.activeGroupId);
    
    return `
        <div class="p-5 max-w-md mx-auto">
            <h3 class="text-xl font-bold mb-4">Kayıtlı Listelerim</h3>
            ${state.savedGroups.length === 0 ? '<p class="text-gray-500 text-center py-10">Henüz kayıt yok.</p>' : ''}
            ${state.savedGroups.map(group => `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-3 flex justify-between items-center border-l-4 border-blue-500">
                    <div>
                        <div class="font-bold text-lg">${group.name}</div>
                        <div class="text-sm text-gray-500">${group.sets.length} Kolon | ${group.config.max}'lık Sistem</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="setState({activeGroupId: '${group.id}'})" class="bg-blue-100 text-blue-700 p-2 rounded">Aç</button>
                        <button onclick="actions.delete('${group.id}')" class="bg-red-100 text-red-600 p-2 rounded text-sm">Sil</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
};

const GroupDetails = (id) => {
    const group = state.savedGroups.find(g => g.id === id);
    if(!group) return setState({activeGroupId: null});

    return `
        <div class="p-5 max-w-md mx-auto">
            <div class="flex items-center gap-3 mb-4">
                <button onclick="setState({activeGroupId: null})" class="text-blue-600 font-bold">← Geri</button>
                <h3 class="text-xl font-bold">${group.name}</h3>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-md mb-5 border-t-4 border-green-500">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold">Çekiliş Sonuçları:</span>
                    <button onclick="setState({isPanelOpen: true})" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">Sonuç Gir</button>
                </div>
                <div class="flex flex-wrap gap-1">
                    ${group.results.main.length > 0 ? group.results.main.map(n => Ball(n, 'main', true)).join('') : '<span class="text-xs text-gray-400">Ana sayı girilmedi</span>'}
                    <div class="w-full my-1"></div>
                    ${group.results.joker.length > 0 ? group.results.joker.map(j => Ball(j, 'joker', true)).join('') : ''}
                </div>
            </div>

            ${group.sets.map((set, i) => `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-3 border border-gray-100">
                    <div class="text-sm text-gray-400 mb-2">Kolon ${i+1}</div>
                    <div class="flex flex-wrap gap-2">
                        ${set.numbers.map(n => Ball(n, 'main', group.results.main.includes(n))).join('')}
                        ${set.jokers.map(j => Ball(j, 'joker', group.results.joker.includes(j))).join('')}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
};

const ResultPanel = () => {
    if (!state.isPanelOpen || !state.activeGroupId) return '';
    const group = state.savedGroups.find(g => g.id === state.activeGroupId);
    
    return `
        <div class="fixed inset-0 bg-black/50 z-50 flex flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 max-h-[80%] overflow-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 sticky top-0 bg-white py-2">
                    <h2 class="text-xl font-bold">Sonuç Seçin</h2>
                    <button onclick="setState({isPanelOpen: false})" class="text-2xl">×</button>
                </div>
                
                <p class="text-sm text-blue-600 font-bold mb-2">Ana Sayı Havuzu (1-${group.config.max})</p>
                <div class="flex flex-wrap gap-2 mb-6">
                    ${Array.from({length: group.config.max}, (_, i) => i + 1).map(n => 
                        Ball(n, 'main', group.results.main.includes(n))
                    ).join('')}
                </div>

                ${group.config.jPer > 0 ? `
                    <p class="text-sm text-red-600 font-bold mb-2">Joker Havuzu (1-${group.config.jMax})</p>
                    <div class="flex flex-wrap gap-2 mb-6">
                        ${Array.from({length: group.config.jMax}, (_, i) => i + 1).map(n => 
                            Ball(n, 'joker', group.results.joker.includes(n))
                        ).join('')}
                    </div>
                ` : ''}
                
                <button onclick="setState({isPanelOpen: false})" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">TAMAMLA</button>
            </div>
        </div>
    `;
};

const Navigation = () => `
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-3 z-40 shadow-lg">
        <button onclick="setState({currentPage: 'generate', activeGroupId: null})" class="flex flex-col items-center ${state.currentPage === 'generate' ? 'text-blue-600' : 'text-gray-400'}">
            <span class="text-xs font-bold uppercase tracking-tighter">Üret</span>
        </button>
        <button onclick="setState({currentPage: 'mySets', activeGroupId: null})" class="flex flex-col items-center ${state.currentPage === 'mySets' ? 'text-blue-600' : 'text-gray-400'}">
            <span class="text-xs font-bold uppercase tracking-tighter">Kayıtlarım</span>
        </button>
    </nav>
`;

/**
 * MAIN RENDER ENGINE
 * Sayfayı temizler ve state'e göre yeniden inşa eder.
 */
function render() {
    const root = document.getElementById('root');
    root.innerHTML = `
        ${Header()}
        <main>
            ${state.currentPage === 'generate' ? GeneratePage() : MySetsPage()}
        </main>
        ${Navigation()}
        ${ResultPanel()}
    `;
}

// Uygulamayı Başlat
render();
</script>

</body>
</html>
