<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Generator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/zustand@4.5.2/dist/umd/zustand.umd.js"></script>
</head>
<body class="bg-slate-50 pb-24">
    <div id="root"></div>

    <script type="text/javascript">
        const { useState, useEffect, useMemo } = React;

        // --- GÜVENLİ ALGORİTMALAR ---
        const secureRandomInt = (max) => {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        };

        const secureShuffle = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        // --- MODERN STATE MANAGEMENT (Zustand Mantığı) ---
        // Not: Tarayıcıda çalıştığı için basit bir React Context/State yapısı kuruyoruz
        
        const App = () => {
            const [view, setView] = useState('generate'); // generate, mySets, detail
            const [savedGroups, setSavedGroups] = useState(() => JSON.parse(localStorage.getItem("savedGroups") || "[]"));
            const [tempSets, setTempSets] = useState([]);
            const [activeGroupId, setActiveGroupId] = useState(null);
            const [inputs, setInputs] = useState({ max: 35, per: 5, jMax: 31, jPer: 1, count: 5 });
            const [isPanelOpen, setIsPanelOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem("savedGroups", JSON.stringify(savedGroups));
            }, [savedGroups]);

            // --- FONKSİYONLAR ---
            const generate = () => {
                const results = [];
                for (let i = 0; i < inputs.count; i++) {
                    const numbers = secureShuffle(Array.from({length: inputs.max}, (_, i) => i + 1))
                                    .slice(0, inputs.per).sort((a,b)=>a-b);
                    const jokers = secureShuffle(Array.from({length: inputs.jMax}, (_, i) => i + 1))
                                    .slice(0, inputs.jPer).sort((a,b)=>a-b);
                    results.push({ numbers, jokers });
                }
                setTempSets(results);
            };

            const saveGroup = (name) => {
                if (!name.trim()) return alert("İsim girin!");
                const newGroup = {
                    id: Date.now().toString(),
                    name,
                    sets: tempSets,
                    config: {...inputs},
                    results: { main: [], joker: [] }
                };
                setSavedGroups([...savedGroups, newGroup]);
                setTempSets([]);
                setView('mySets');
            };

            const toggleMatch = (groupId, val, type) => {
                setSavedGroups(prev => prev.map(g => {
                    if (g.id !== groupId) return g;
                    const list = type === 'main' ? [...g.results.main] : [...g.results.joker];
                    const idx = list.indexOf(val);
                    if (idx > -1) list.splice(idx, 1);
                    else list.push(val);
                    return { ...g, results: { ...g.results, [type]: list } };
                }));
            };

            // --- BİLEŞENLER ---
            const Ball = ({ num, isJoker, isSelected }) => (
                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm border transition-all
                    ${isSelected ? 'bg-blue-600 text-white border-transparent' : 
                      isJoker ? 'bg-red-50 text-red-600 border-red-200' : 'bg-white text-slate-700 border-slate-200'}`}>
                    {num}
                </div>
            );

            const activeGroup = savedGroups.find(g => g.id === activeGroupId);

            return (
                <div className="max-w-md mx-auto min-h-screen relative">
                    {/* Header */}
                    <header className="bg-blue-700 text-white p-5 text-center text-xl font-bold shadow-lg sticky top-0 z-40">
                        Lucky Generator Pro
                    </header>

                    <main className="p-4">
                        {view === 'generate' && (
                            <div className="space-y-4">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase">Havuz</label>
                                            <input type="number" className="w-full p-2 border rounded mt-1" value={inputs.max} onChange={e => setInputs({...inputs, max: +e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase">Adet</label>
                                            <input type="number" className="w-full p-2 border rounded mt-1" value={inputs.per} onChange={e => setInputs({...inputs, per: +e.target.value})} />
                                        </div>
                                    </div>
                                    <button onClick={generate} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold active:scale-95 transition-transform">KOLONLARI ÜRET</button>
                                </div>

                                {tempSets.map((set, i) => (
                                    <div key={i} className="bg-white p-4 rounded-lg shadow-sm">
                                        <span className="text-xs text-blue-600 font-bold">KOLON {i+1}</span>
                                        <div className="flex flex-wrap gap-2 mt-2">
                                            {set.numbers.map(n => <Ball key={n} num={n} />)}
                                            {set.jokers.map(j => <Ball key={j} num={j} isJoker />)}
                                        </div>
                                    </div>
                                ))}

                                {tempSets.length > 0 && (
                                    <div className="bg-white p-4 rounded-lg border-2 border-dashed border-blue-200">
                                        <input id="gn" type="text" placeholder="Grup Adı (Örn: Süper Loto)" className="w-full p-2 border rounded mb-2" />
                                        <button onClick={() => saveGroup(document.getElementById('gn').value)} className="w-full bg-green-600 text-white py-2 rounded-lg">Kaydet</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'mySets' && (
                            <div className="space-y-3">
                                <h3 className="font-bold text-slate-700">Kayıtlı Listelerim</h3>
                                {savedGroups.length === 0 && <p className="text-slate-400">Henüz kayıt yok.</p>}
                                {savedGroups.map(g => (
                                    <div key={g.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-slate-800">{g.name}</div>
                                            <div className="text-xs text-slate-500">{g.sets.length} Kolon</div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => {setActiveGroupId(g.id); setView('detail')}} className="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-bold">Aç</button>
                                            <button onClick={() => setSavedGroups(savedGroups.filter(x => x.id !== g.id))} className="bg-red-50 text-red-500 p-2 rounded-lg leading-none">×</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'detail' && activeGroup && (
                            <div className="space-y-4">
                                <button onClick={() => setView('mySets')} className="text-blue-600 font-bold text-sm">← Geri Dön</button>
                                <div className="flex justify-between items-end">
                                    <h2 className="text-2xl font-bold">{activeGroup.name}</h2>
                                    <button onClick={() => setIsPanelOpen(true)} className="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-md">SONUÇ GİR</button>
                                </div>

                                {activeGroup.sets.map((set, i) => (
                                    <div key={i} className="bg-white p-4 rounded-lg shadow-sm border border-slate-100">
                                        <div className="flex flex-wrap gap-2">
                                            {set.numbers.map(n => <Ball key={n} num={n} isSelected={activeGroup.results.main.includes(n)} />)}
                                            {set.jokers.map(j => <Ball key={j} num={j} isJoker isSelected={activeGroup.results.joker.includes(j)} />)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Sonuç Giriş Paneli (Overlay) */}
                    {isPanelOpen && activeGroup && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end">
                            <div className="bg-white w-full max-h-[80vh] rounded-t-3xl p-6 overflow-y-auto shadow-2xl">
                                <div className="flex justify-between mb-4 border-b pb-2">
                                    <h3 className="font-bold">Kazanan Numaraları Seç</h3>
                                    <button onClick={() => setIsPanelOpen(false)} className="text-2xl leading-none">&times;</button>
                                </div>
                                
                                <p className="text-xs font-bold text-slate-400 mb-2 uppercase">ANA SAYILAR</p>
                                <div className="flex flex-wrap gap-2 mb-6">
                                    {Array.from({length: activeGroup.config.max}, (_, i) => i + 1).map(n => (
                                        <button key={n} onClick={() => toggleMatch(activeGroup.id, n, 'main')} 
                                            className={`w-9 h-9 rounded-full border flex items-center justify-center font-bold text-xs
                                            ${activeGroup.results.main.includes(n) ? 'bg-blue-600 text-white border-transparent' : 'bg-slate-50'}`}>
                                            {n}
                                        </button>
                                    ))}
                                </div>

                                {activeGroup.config.jPer > 0 && (
                                    <>
                                        <p className="text-xs font-bold text-red-400 mb-2 uppercase">JOKER SAYILARI</p>
                                        <div className="flex flex-wrap gap-2 mb-6">
                                            {Array.from({length: activeGroup.config.jMax}, (_, i) => i + 1).map(n => (
                                                <button key={n} onClick={() => toggleMatch(activeGroup.id, n, 'joker')} 
                                                    className={`w-9 h-9 rounded-full border flex items-center justify-center font-bold text-xs
                                                    ${activeGroup.results.joker.includes(n) ? 'bg-red-600 text-white border-transparent' : 'bg-red-50 text-red-400 border-red-100'}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    </>
                                )}
                                <button onClick={() => setIsPanelOpen(false)} className="w-full bg-blue-700 text-white py-3 rounded-xl font-bold">TAMAMLA</button>
                            </div>
                        </div>
                    )}

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-3 z-40 max-w-md mx-auto">
                        <button onClick={() => setView('generate')} className={`flex flex-col items-center gap-1 ${view === 'generate' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <span className="text-xl">🎲</span>
                            <span className="text-[10px] font-bold">ÜRET</span>
                        </button>
                        <button onClick={() => setView('mySets')} className={`flex flex-col items-center gap-1 ${view === 'mySets' || view === 'detail' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <span className="text-xl">📋</span>
                            <span className="text-[10px] font-bold">KAYITLARIM</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
