<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Generator Pro - Stable State</title>
<style>
    body{ margin:0; font-family:Arial, sans-serif; background:#f2f6fb; padding-bottom: 100px; }
    body.modal-open { overflow: hidden; }
    header{ background:#1976d2; color:white; padding:20px; text-align:center; font-size:22px; font-weight:bold; position: relative; }

    #crypto-status { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.2); font-size: 10px; padding: 2px; color: #e0e0e0; }

    @keyframes slideIn { from{transform:translateY(-20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
    #global-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.6); z-index: 4000; cursor: wait; }
    #resultPanel { display:none; position:fixed; bottom:0; left:0; width:100%; background:#fff; padding:15px; box-shadow:0 -2px 15px rgba(0,0,0,0.3); max-height:85%; overflow:auto; z-index: 2000; border-radius: 20px 20px 0 0; box-sizing: border-box; }
</style>
</head>
<body>

<div id="global-loader"></div>
<div id="error-monitor"></div> 
<header>
    Lucky Generator
    <div id="crypto-status">Motor: Bekleniyor...</div>
</header>

<div id="app">
    <div id="view-container"></div>
</div>

<div class="bottom-nav">
    <button id="nav-btn-generate">Üret</button>
    <button id="nav-btn-mySets">Kayıtlarım</button>
</div>

<div id="resultPanel">
    <h3 style="margin-top:0;">Sonuç Gir <span id="close-panel-btn" style="float:right;cursor:pointer; padding: 5px;">×</span></h3>
    <div id="resultNumbers"></div>
    <div style="margin-top: 15px;">
        <button id="btn-confirm-result">Tamamla</button>
        <button id="btn-clean-result" style="background:#999;margin-top:8px;">Tümünü Temizle</button>
    </div>
</div>

<input type="file" id="import-file-input" accept=".json" style="display:none;">

<script>
/* --- CORE UTILITIES --- */
const getEl = (id) => document.getElementById(id);
const setLoading = (state) => { const el = getEl("global-loader"); if(el) el.style.display = state ? "block" : "none"; };

function toggleBodyScroll(lock) {
    if (lock) {
        document.body.classList.add("modal-open");
    } else {
        document.body.classList.remove("modal-open");
    }
}

const ErrorHandler = {
    report: function(type, data) {
        console.error(`[${type}]`, data.message || data);
        const monitor = getEl("error-monitor");
        if(monitor) {
            const toast = document.createElement("div");
            toast.className = "error-toast";
            const strong = document.createElement("strong");
            strong.textContent = `[${type}]`;
            const br = document.createElement("br");
            const small = document.createElement("small");
            small.textContent = (data.message || String(data)).substring(0, 100);
            toast.appendChild(strong);
            toast.appendChild(br);
            toast.appendChild(small);
            toast.onclick = () => toast.remove();
            monitor.appendChild(toast);
            setTimeout(() => { if(toast.parentNode) toast.remove(); }, 6000);
        }
    }
};

window.onerror = (message, source, lineno, colno, error) => { ErrorHandler.report("Runtime Error", {message, source, lineno, colno, error}); return false; };
window.onunhandledrejection = (event) => { ErrorHandler.report("Promise Error", { message: event.reason?.message || "Asenkron işlem başarısız" }); return false; };

let generatedSets = [];
let lastRequestId = 0; 
let isProcessing = false; 
let cryptoTimeout = null;

function escapeHTML(str) { if (!str) return ""; const p = document.createElement("p"); p.textContent = str; return p.innerHTML; }

/* --- CRYPTO ENGINE --- */
const CryptoEngine = {
    isSecure: !!(window.crypto && window.crypto.getRandomValues),
    nextUint32: function(max) {
        if (!this.isSecure) throw new Error("GÜVENLİ MOTOR BULUNAMADI!");
        if (typeof max !== 'number' || isNaN(max) || max <= 0) throw new Error("GEÇERSİZ MAKSİMUM DEĞER!");
        if (max <= 1) return 0;
        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / max) * max;
        let val;
        do { window.crypto.getRandomValues(buf); val = buf[0]; } while (val >= limit);
        return val % max;
    },
    updateUI: function() {
        const statusEl = getEl("crypto-status");
        if(statusEl) {
            if(cryptoTimeout) clearTimeout(cryptoTimeout);
            statusEl.innerHTML = `Motor: <span class="engine-badge">Web Crypto (Güvenli)</span>`;
            cryptoTimeout = setTimeout(() => {
                statusEl.innerHTML = `Motor: Bekleniyor...`;
            }, 10000);
        }
    }
};

function secureShuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = CryptoEngine.nextUint32(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
    }
    CryptoEngine.updateUI();
    return array;
}

/* --- DATABASE CONFIG & SINGLETON CONNECTION --- */
const DB_CONFIG = { 
    name: "LuckyDB", 
    version: 4, 
    storeName: "savedGroups", 
    draftStore: "drafts",
    lockName: "db_write_lock" 
};

let dbInstance = null;

function getDB() {
    return new Promise((res, rej) => {
        if (dbInstance) return res(dbInstance);
        const req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
        req.onblocked = () => { alert("Lütfen diğer sekmeleri kapatın."); rej(new Error("DB Blocked")); };
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(DB_CONFIG.storeName)) db.createObjectStore(DB_CONFIG.storeName, { keyPath: "id" });
            if (!db.objectStoreNames.contains(DB_CONFIG.draftStore)) db.createObjectStore(DB_CONFIG.draftStore, { keyPath: "id" });
        };
        req.onsuccess = () => {
            dbInstance = req.result;
            dbInstance.onversionchange = () => { 
                dbInstance.close(); 
                dbInstance = null; 
            };
            res(dbInstance);
        };
        req.onerror = (e) => rej(new Error("DB Hatası: " + (e.target.error ? e.target.error.message : "Bilinmeyen Hata")));
    });
}

/* --- VALIDATION & INTEGRITY --- */
// DÜZELTME 5: Array içerisindeki sayıları temizlerken mükerrer (duplicate) kayıtları engellemek için Array.from(new Set(...)) kullanıldı.
const cleanNumberArray = (arr) => {
    if (!Array.isArray(arr)) return [];
    const cleaned = arr
        .map(n => parseInt(n, 10))
        .filter(n => !isNaN(n) && typeof n === 'number' && n > 0);
    return Array.from(new Set(cleaned));
};

const Validator = {
    validateGroup: (data) => {
        try {
            if (!data || typeof data !== 'object') return null;

            const validatedSets = Array.isArray(data.sets) 
                ? data.sets.map(set => ({
                    numbers: cleanNumberArray(set.numbers),
                    jokers: cleanNumberArray(set.jokers),
                    max: Number(set.max) || 49,
                    jokerMax: Number(set.jokerMax) || 0
                })).filter(set => set.numbers.length > 0)
                : [];

            return {
                id: data.id ? String(data.id) : String(Date.now()),
                name: data.name ? escapeHTML(String(data.name)) : "İsimsiz Liste",
                sets: validatedSets,
                max: Number(data.max) || 49,
                jokerMax: Number(data.jokerMax) || 0,
                jokerPerSet: Number(data.jokerPerSet) || 0,
                results: {
                    main: cleanNumberArray(data.results?.main),
                    joker: cleanNumberArray(data.results?.joker)
                },
                version: Number(data.version) || Date.now()
            };
        } catch (e) { return null; }
    }
};

let lockQueue = Promise.resolve();
async function withLock(workFn) {
    if (navigator.locks) return navigator.locks.request(DB_CONFIG.lockName, workFn);
    const currentLock = lockQueue.then(() => workFn()).catch((err) => ErrorHandler.report("Queue Error", err));
    lockQueue = currentLock;
    return currentLock;
}

/* --- DB OPERATIONS --- */
async function getDraft(id) {
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.draftStore, "readonly");
        const req = tx.objectStore(DB_CONFIG.draftStore).get(id);
        return await new Promise(res => { req.onsuccess = () => res(req.result); });
    } catch(e) { return null; }
}

async function saveDraft(id, data) {
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.draftStore, "readwrite");
        tx.objectStore(DB_CONFIG.draftStore).put({id, data, ts: Date.now()});
        await new Promise(res => tx.oncomplete = res);
    } catch(e) { ErrorHandler.report("Draft Save Error", e); }
}

async function deleteDraft(id) {
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.draftStore, "readwrite");
        tx.objectStore(DB_CONFIG.draftStore).delete(id);
        await new Promise(res => tx.oncomplete = res);
    } catch(e) { ErrorHandler.report("Draft Delete Error", e); }
}

async function getAllGroups() {
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.storeName, "readonly");
        const req = tx.objectStore(DB_CONFIG.storeName).getAll();
        return await new Promise((res) => {
            req.onsuccess = (e) => res((e.target.result || []).map(Validator.validateGroup).filter(Boolean));
        });
    } catch (e) { return []; }
}

async function getGroupById(id) {
    if(!id) return null;
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.storeName, "readonly");
        const req = tx.objectStore(DB_CONFIG.storeName).get(String(id));
        return await new Promise((res) => {
            req.onsuccess = (e) => res(Validator.validateGroup(e.target.result));
        });
    } catch(e) { return null; }
}

// DÜZELTME 2: Transaksiyon zaman aşımını önlemek için DB bağlantısı ve doğrulama kilit öncesinde alınıyor, kilit içinde anında yazma gerçekleşiyor.
async function atomicSave(item) {
    const val = Validator.validateGroup(item);
    if (!val) throw new Error("Doğrulama hatası.");
    const db = await getDB();

    return withLock(async () => {
        return await new Promise((res, rej) => {
            const tx = db.transaction(DB_CONFIG.storeName, "readwrite");
            val.version = Date.now();
            tx.objectStore(DB_CONFIG.storeName).put(val);
            tx.oncomplete = () => res();
            tx.onerror = () => rej(new Error("Yazma hatası"));
        });
    });
}

async function deleteFromDB(id) {
    try {
        const db = await getDB();
        const tx = db.transaction(DB_CONFIG.storeName, "readwrite");
        tx.objectStore(DB_CONFIG.storeName).delete(String(id));
        await new Promise(res => tx.oncomplete = res);
    } catch(e) { ErrorHandler.report("Delete Error", e); }
}

/* --- YEDEKLEME VE İÇE AKTARMA (JSON) --- */
async function exportBackup() {
    try {
        const groups = await getAllGroups();
        if (groups.length === 0) { alert("Dışa aktarılacak kayıtlı veri bulunamadı."); return; }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(groups, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `LuckyGenerator_Yedek_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    } catch(e) { ErrorHandler.report("Export Error", e); }
}

function triggerImport() {
    getEl("import-file-input").click();
}

async function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const importedData = JSON.parse(e.target.result);
            if (!Array.isArray(importedData)) throw new Error("Geçersiz yedek dosyası formatı.");
            let count = 0;
            for (const item of importedData) {
                const valid = Validator.validateGroup(item);
                if (valid) {
                    await atomicSave(valid);
                    count++;
                }
            }
            alert(`${count} adet liste başarıyla yükledi.`);
            renderCurrentState("mySets");
        } catch(err) { alert("Yükleme başarısız: " + err.message); }
        finally { event.target.value = ""; }
    };
    reader.readAsText(file);
}

/* --- NAVIGATION & UI LOGIC --- */
async function requestPersistentStorage() {
    if (navigator.storage && navigator.storage.persist) {
        const isPersisted = await navigator.storage.persisted();
        if (!isPersisted) await navigator.storage.persist();
    }
}

window.onload = async () => { 
    if (!CryptoEngine.isSecure) {
        document.body.innerHTML = `<div style="padding:40px; text-align:center; color:#d32f2f;"><h2>⚠ Güvenlik</h2><p>Web Crypto API desteklenmiyor.</p></div>`;
        return;
    }
    
    getEl("nav-btn-generate").addEventListener("click", () => navTo('generate'));
    getEl("nav-btn-mySets").addEventListener("click", () => navTo('mySets'));
    getEl("close-panel-btn").addEventListener("click", () => closeResultPanel(true));
    getEl("btn-confirm-result").addEventListener("click", confirmResult);
    getEl("btn-clean-result").addEventListener("click", cleanResult);
    getEl("import-file-input").addEventListener("change", handleFileImport);

    await requestPersistentStorage();
    const state = history.state || {page:"generate", groupId:null};
    if (state.page === "panel" && state.groupId) {
        await renderCurrentState("mySets", state.groupId);
        openResultPanel(null, state.groupId, false);
    } else {
        renderCurrentState(state.page, state.groupId); 
    }
};

window.onpopstate = async (event) => { 
    lastRequestId++; 
    const state = event.state || {page:"generate", groupId:null}; 
    if (state.page !== "panel") {
        closeResultPanel(false); 
    } else {
        openResultPanel(null, state.groupId, false);
    }
    await renderCurrentState(state.page, state.groupId); 
};

function navTo(page, groupId = null) { 
    if (isProcessing) return; 
    history.pushState({page, groupId: groupId ? String(groupId) : null}, ""); 
    renderCurrentState(page, groupId); 
}

async function renderCurrentState(page, groupId) {
    const currentRequestId = ++lastRequestId; 
    const container = getEl("view-container");
    if(!container) return;
    
    if (page !== "panel") {
        const panel = getEl("resultPanel");
        if(panel) panel.style.display = "none";
        toggleBodyScroll(false); 
        container.innerHTML = `<div style="padding:20px; color:#666;">Yükleniyor...</div>`;
    }
    
    try {
        if (page === "generate") {
            if (currentRequestId === lastRequestId) await renderGeneratePage();
        } else if (page === "mySets") { 
            if (groupId) {
                const group = await getGroupById(groupId);
                if (currentRequestId === lastRequestId) {
                    group ? await renderViewGroup(group, currentRequestId) : await renderMySetsList(currentRequestId);
                }
            } else { await renderMySetsList(currentRequestId); }
        }
    } catch (e) { ErrorHandler.report("Render Error", e); }
}

/* --- GENERATE & SAVE LOGIC --- */
async function renderGeneratePage() {
    let storedInputs = {max:35, per:5, jMax:31, jPer:1, count:5};
    const dSets = await getDraft("tempSets");
    const dInputs = await getDraft("tempInputs");
    generatedSets = dSets ? dSets.data : [];
    if(dInputs) storedInputs = dInputs.data;
    
    getEl("view-container").innerHTML = `
        <div class="container">
            <div class="card">
                <b>Ana Grup (1 - ?)</b>
                <input type="number" id="maxNumber" value="${storedInputs.max}">
                <label>Seçilecek Sayı</label>
                <input type="number" id="perSet" value="${storedInputs.per}">
                <hr>
                <b>Joker (1 - ?)</b>
                <input type="number" id="jokerMax" value="${storedInputs.jMax}">
                <label>Joker Sayısı</label>
                <input type="number" id="jokerCount" value="${storedInputs.jPer}">
                <hr>
                <label>Kolon Sayısı</label>
                <input type="number" id="setCount" value="${storedInputs.count}">
                <button id="btn-generate-action">Rastgele Üret</button>
            </div>
            <div id="results"></div>
        </div>`;
    
    getEl("btn-generate-action").addEventListener("click", generateSets);
    renderGeneratedSetsList();
}

function renderGeneratedSetsList() {
    const resultsDiv = getEl("results");
    if(!resultsDiv) return;
    resultsDiv.innerHTML = ""; 
    generatedSets.forEach((set, i) => { 
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<b>${i+1}. Kolon</b>`;
        card.appendChild(createBallsUI(set));
        resultsDiv.appendChild(card);
    }); 
    if (generatedSets.length > 0) { 
        const actionCard = document.createElement("div");
        actionCard.className = "card";
        actionCard.innerHTML = `
            <button class="delete-all-btn" id="btn-clear-generated">Üretilenleri Sil</button>
            <label><b>Liste Adı</b></label>
            <input type="text" id="groupNameInput" placeholder="İsim verin...">
            <button id="btn-save-group">Kalıcı Olarak Kaydet</button>`;
        resultsDiv.appendChild(actionCard);
        
        getEl("btn-clear-generated").addEventListener("click", clearGeneratedSets);
        getEl("btn-save-group").addEventListener("click", saveGroup);
    }
}

async function generateSets() {
    if (isProcessing) return;
    const maxEl = getEl("maxNumber");
    const perEl = getEl("perSet");
    const jMaxEl = getEl("jokerMax");
    const jPerEl = getEl("jokerCount");
    const countEl = getEl("setCount");

    if (!maxEl || !perEl || !jMaxEl || !jPerEl || !countEl) return;

    const max = parseInt(maxEl.value, 10) || 0;
    const per = parseInt(perEl.value, 10) || 0;
    const jMax = parseInt(jMaxEl.value, 10) || 0;
    const jPer = parseInt(jPerEl.value, 10) || 0;
    const count = parseInt(countEl.value, 10) || 0;

    if (max <= 0 || per <= 0 || max < per || (jPer > 0 && jMax < jPer) || count < 1) { 
        alert("Geçersiz parametre!"); 
        return; 
    }
    try {
        setLoading(true);
        isProcessing = true;
        generatedSets = [];
        for (let i = 0; i < count; i++) {
            const mainPool = Array.from({length: max}, (_, k) => k + 1);
            const n = secureShuffle([...mainPool]).slice(0, per).sort((a,b)=>a-b);
            let j = [];
            if (jMax > 0 && jPer > 0) {
                const jokerPool = Array.from({length: jMax}, (_, k) => k + 1);
                j = secureShuffle([...jokerPool]).slice(0, jPer).sort((a,b)=>a-b);
            }
            generatedSets.push({numbers: n, jokers: j, max, jokerMax: jMax});
        }
        await saveDraft("tempSets", generatedSets);
        await saveDraft("tempInputs", {max, per, jMax, jPer, count});
        renderGeneratedSetsList();
    } catch(e) {
        ErrorHandler.report("Generate Error", e);
    } finally { 
        setLoading(false); 
        isProcessing = false; 
    }
}

async function saveGroup() {
    if (isProcessing) return;
    const nameEl = getEl("groupNameInput");
    if (!nameEl) return;
    const name = nameEl.value.trim();
    if (!name) { alert("İsim verin."); return; }

    const maxVal = generatedSets.length > 0 ? generatedSets[0].max : (parseInt(getEl("maxNumber")?.value, 10) || 49);
    const jMaxVal = generatedSets.length > 0 ? generatedSets[0].jokerMax : (parseInt(getEl("jokerMax")?.value, 10) || 0);
    const jPerVal = parseInt(getEl("jokerCount")?.value, 10) || (generatedSets.length > 0 ? generatedSets[0].jokers.length : 0);

    const group = {
        id: String(Date.now()), name: name, sets: [...generatedSets],
        max: maxVal, jokerMax: jMaxVal,
        jokerPerSet: jPerVal, results: {main: [], joker: []}
    };
    try { 
        setLoading(true);
        isProcessing = true;
        await atomicSave(group);
        await deleteDraft("tempSets");
        await deleteDraft("tempInputs");
        isProcessing = false;
        navTo('mySets', group.id); 
    } catch(err) { 
        ErrorHandler.report("Save Error", err); 
    } finally { 
        isProcessing = false;
        setLoading(false); 
    }
}

/* --- VIEW SAVED DATA --- */
async function renderMySetsList(reqId) {
    const groups = await getAllGroups(); 
    const view = getEl("view-container");
    if (!view || reqId !== lastRequestId) return;
    view.innerHTML = ""; 
    const container = document.createElement("div"); 
    container.className = "container"; 
    container.innerHTML = `
        <h3>Kayıtlı Listelerim</h3>
        <div style="margin-bottom: 15px;">
            <button id="btn-export-backup" class="secondary-btn">Yedekle (JSON Dışa Aktar)</button>
            <button id="btn-import-backup" class="secondary-btn">Yedek Yükle (JSON İçe Aktar)</button>
        </div>
    `;
    
    if (groups.length === 0) {
        container.innerHTML += "<p>Henüz kayıtlı kolon yok.</p>";
    } else {
        groups.forEach(group => {
            const card = document.createElement("div"); card.className = "card";
            card.innerHTML = `<b>${escapeHTML(group.name)}</b><div style="font-size:12px; color:#666;">${group.sets.length} Kolon | ${group.max}'lık Sistem</div>`;
            const btnView = document.createElement("button"); btnView.textContent = "Aç"; btnView.onclick = () => navTo("mySets", group.id);
            const btnDel = document.createElement("button"); btnDel.textContent = "Sil"; btnDel.style.background = "#d32f2f"; btnDel.style.marginTop = "5px"; btnDel.onclick = () => deleteGroup(group.id);
            card.append(btnView, btnDel); container.appendChild(card);
        });
    }
    view.appendChild(container);

    getEl("btn-export-backup").addEventListener("click", exportBackup);
    getEl("btn-import-backup").addEventListener("click", triggerImport);
}

async function renderViewGroup(group, reqId) {
    const view = getEl("view-container");
    if (!view || reqId !== lastRequestId) return;
    const container = document.createElement("div"); container.className = "container";
    container.innerHTML = `<h3>${escapeHTML(group.name)}</h3>`;
    const hasRes = group.results.main.length > 0 || group.results.joker.length > 0;
    const resCard = document.createElement("div"); resCard.className = "card";
    resCard.innerHTML = `<b>Çıkan Sonuçlar:</b><div style="margin:10px 0; font-family:monospace; background:#f0f0f0; padding:5px; border-radius:4px;">
        ${hasRes ? 'Ana: '+[...group.results.main].sort((a,b)=>a-b).join(', ') : 'Girilmedi'}<br>
        ${group.jokerPerSet > 0 ? 'Joker: ' + (group.results.joker.length ? [...group.results.joker].sort((a,b)=>a-b).join(', ') : '-') : ''}
    </div>`;
    const openBtn = document.createElement("button"); openBtn.textContent = "Sonuçları Gir"; openBtn.onclick = () => openResultPanel(group.max, group.id);
    resCard.appendChild(openBtn); container.append(resCard);
    group.sets.forEach((set, i) => { 
        const setCard = document.createElement("div"); setCard.className = "card";
        setCard.innerHTML = `<b>${i+1}. Kolon</b>`;
        setCard.appendChild(createBallsUI(set, group.results)); container.appendChild(setCard);
    });
    const backBtn = document.createElement("button"); backBtn.textContent = "Geri Dön"; backBtn.style.background = "#666"; backBtn.onclick = () => navTo("mySets");
    container.appendChild(backBtn);
    view.innerHTML = ""; view.appendChild(container);
}

function createBallsUI(set, results = null) {
    const row = document.createElement("div"); row.className = "ball-row";
    set.numbers.forEach(n => {
        const ball = document.createElement("div"); ball.className = "ball selected";
        if(results && results.main.includes(Number(n))) ball.classList.add("result-selected");
        ball.textContent = n; row.appendChild(ball);
    });
    set.jokers.forEach(j => {
        const ball = document.createElement("div"); ball.className = "ball joker";
        if(results && results.joker.includes(Number(j))) ball.classList.add("result-selected");
        ball.textContent = j; row.appendChild(ball);
    });
    return row;
}

/* --- RESULT PANEL & SYNC LOGIC --- */
async function openResultPanel(max, groupId, shouldPushState = true) {
    const group = await getGroupById(groupId); 
    if(!group) return;
    const targetMax = max || group.max;
    const resDiv = getEl("resultNumbers");
    resDiv.innerHTML = "";
    const createRow = (title, limit, isJoker) => {
        const h = document.createElement("h4"); h.textContent = title; h.style.margin = "15px 0 5px 0";
        const row = document.createElement("div"); row.className = "ball-row";
        for(let i=1; i<=limit; i++) {
            const ball = document.createElement("div");
            ball.className = "ball" + (isJoker ? " joker" : "");
            const list = isJoker ? group.results.joker : group.results.main;
            if(list.includes(i)) ball.classList.add("result-selected");
            ball.textContent = i;
            ball.onclick = () => toggleResult(ball, groupId, i, isJoker);
            row.appendChild(ball);
        }
        resDiv.append(h, row);
    };
    createRow(`Ana Sayılar (1-${targetMax})`, targetMax, false);
    if (group.jokerPerSet > 0) createRow(`Joker Sayılar (1-${group.jokerMax})`, group.jokerMax, true);
    if (shouldPushState) history.pushState({page: "panel", groupId: String(groupId)}, "");
    getEl("resultPanel").style.display = "block";
    toggleBodyScroll(true);
}

async function toggleResult(el, id, val, isJoker) {
    if (isProcessing) return; 
    isProcessing = true;
    el.style.opacity = "0.4";
    let updatedGroup = null;
    try {
        const g = await getGroupById(id);
        if (g) {
            const list = isJoker ? g.results.joker : g.results.main;
            const idx = list.indexOf(val);
            if (idx > -1) {
                list.splice(idx, 1);
            } else {
                // DÜZELTME 3: Joker girerken gruptaki kolon joker sayısı sınırına takılmamak için maksimum üst limit 10 sayıya esnetildi.
                const limit = 10;
                if (list.length >= limit) { 
                    alert(isJoker ? "Maks 10 joker sayısı!" : "Maks 10 sayı!"); 
                    isProcessing = false;
                    el.style.opacity = "1";
                    return; 
                }
                list.push(val);
            }
            await atomicSave(g);
            el.classList.toggle("result-selected");
            updatedGroup = g;
        }
        if (updatedGroup && history.state?.groupId === id) {
            await renderViewGroup(updatedGroup, lastRequestId);
        }
    } catch(e) {
        ErrorHandler.report("Result Toggle Error", e);
    } finally { 
        el.style.opacity = "1"; 
        isProcessing = false; 
    }
}

async function deleteGroup(id) { 
    if (isProcessing || !confirm("Silinsin mi?")) return; 
    try { setLoading(true); isProcessing = true; await deleteFromDB(id); await renderMySetsList(lastRequestId); } 
    catch(e) { ErrorHandler.report("Delete Error", e); }
    finally { setLoading(false); isProcessing = false; } 
}

// DÜZELTME 4: history.length kontrolü yerine aktif state takibi yapılarak farklı sitelere yönlenme riski kapatıldı.
function closeResultPanel(forceBack = true) { 
    const currentState = history.state;
    const isPanelState = currentState && currentState.page === "panel";
    getEl("resultPanel").style.display = "none"; 
    toggleBodyScroll(false);

    if (forceBack && isPanelState) {
        history.back();
    }
}

function confirmResult() { closeResultPanel(true); }

async function cleanResult() { 
    const id = history.state?.groupId;
    if (isProcessing || !id || !confirm("Seçimler temizlensin mi?")) return; 
    let updatedGroup = null;
    try { 
        setLoading(true); isProcessing = true;
        const g = await getGroupById(id); 
        if(g) { 
            g.results = {main: [], joker: []}; 
            await atomicSave(g); 
            updatedGroup = g;
            document.querySelectorAll("#resultNumbers .ball").forEach(b => b.classList.remove("result-selected"));
        } 
        if (updatedGroup) {
            await renderViewGroup(updatedGroup, lastRequestId);
        }
    } catch(e) { ErrorHandler.report("Clean Result Error", e); }
    finally { setLoading(false); isProcessing = false; }
}

async function clearGeneratedSets() {
    if (isProcessing || !confirm("Üretilen tüm kolonlar temizlensin mi?")) return;
    try {
        isProcessing = true;
        generatedSets = [];
        await deleteDraft("tempSets");
        await deleteDraft("tempInputs");
        renderGeneratedSetsList();
    } catch(e) {
        ErrorHandler.report("Clear Drafts Error", e);
    } finally {
        isProcessing = false;
    }
}
</script>
