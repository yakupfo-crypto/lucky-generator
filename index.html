const getEl = (id) => document.getElementById(id);

const ErrorHandler = {
    report: function(type, data) {
        console.error(`[${type}]`, data.message || data);

        const monitor = getEl("error-monitor");

        if(monitor) {
            const toast = document.createElement("div");
            toast.className = "error-toast";

            const strong = document.createElement("strong");
            strong.textContent = `[${type}]`;

            const br = document.createElement("br");

            const small = document.createElement("small");
            small.textContent = (data.message || String(data)).substring(0, 100);

            toast.appendChild(strong);
            toast.appendChild(br);
            toast.appendChild(small);

            toast.onclick = () => toast.remove();

            monitor.appendChild(toast);

            setTimeout(() => {
                if(toast.parentNode) toast.remove();
            }, 6000);
        }
    }
};

window.onerror = (message, source, lineno, colno, error) => {

        message,
        source,
        lineno,
        colno,

    });

window.onunhandledrejection = (event) => {

        message: event.reason?.message || "Asenkron işlem başarısız"

/* --- CRYPTO ENGINE --- */
const CryptoEngine = {
    isSecure: !!(window.crypto && window.crypto.getRandomValues),

    nextUint32: function(max) {
        if (!this.isSecure) {
            throw new Error("GÜVENLİ MOTOR BULUNAMADI!");
        }

        if (
            typeof max !== 'number' ||
            !Number.isFinite(max) ||
            max <= 0 ||
            !Number.isInteger(max)
        ) {
            throw new Error("GEÇERSİZ MAKSİMUM DEĞER!");
        }

        if (max <= 1) return 0;

        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / max) * max;

        let val;

        do {
            window.crypto.getRandomValues(buf);
            val = buf[0];
        } while (val >= limit);

        return val % max;
    },

    updateUI: function() {
        const statusEl = getEl("crypto-status");

        if(statusEl) {
            if(cryptoTimeout) clearTimeout(cryptoTimeout);

            statusEl.innerHTML =
                `Motor: <span class="engine-badge">Web Crypto (Güvenli)</span>`;

            cryptoTimeout = setTimeout(() => {
                statusEl.innerHTML = `Motor: Bekleniyor...`;
            }, 10000);
        }
    }
};

function secureShuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = CryptoEngine.nextUint32(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
    }

    CryptoEngine.updateUI();

    return array;
}

/* --- DATABASE CONFIG & SINGLETON CONNECTION --- */
const DB_CONFIG = {
    name: "LuckyDB",
    version: 4,
    storeName: "savedGroups",
    draftStore: "drafts",
    lockName: "db_write_lock"
};

let dbInstance = null;

function getDB() {
    return new Promise((resolve, reject) => {

        if (dbInstance) {
            resolve(dbInstance);
            return;
        }

        let settled = false;

        const fail = (error) => {
            if (settled) return;
            settled = true;
            reject(error instanceof Error ? error : new Error(String(error)));
        };

        const succeed = (db) => {
            if (settled) return;
            settled = true;
            resolve(db);
        };

        let req;

        try {
            req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
        } catch (e) {
            fail(e);
            return;
        }

        req.onblocked = () => {
            alert("Lütfen diğer sekmeleri kapatın.");
            fail(new Error("DB Blocked"));
        };

        req.onupgradeneeded = (e) => {
            try {
                const db = e.target.result;

                if (!db.objectStoreNames.contains(DB_CONFIG.storeName)) {
                    db.createObjectStore(
                        DB_CONFIG.storeName,
                        { keyPath: "id" }
                    );
                }

                if (!db.objectStoreNames.contains(DB_CONFIG.draftStore)) {
                    db.createObjectStore(
                        DB_CONFIG.draftStore,
                        { keyPath: "id" }
                    );
                }
            } catch (err) {
                fail(err);
            }
        };

        req.onsuccess = () => {
            const db = req.result;

            dbInstance = db;

            dbInstance.onversionchange = () => {
                dbInstance.close();
                dbInstance = null;
            };

            succeed(db);
        };

        req.onerror = () => {
            const error = req.error;

            fail(
                new Error(
                    "DB Hatası: " +
                    (error ? error.message : "Bilinmeyen Hata")
                )
            );
        };

        req.onabort = () => {
            fail(new Error("DB açma işlemi iptal edildi."));
        };
    });
}

/* --- VALIDATION & INTEGRITY --- */

const cleanNumberArray = (arr) => {
    if (!Array.isArray(arr)) return [];

    return arr
        .map(n => parseInt(n, 10))
        .filter(n =>
            Number.isInteger(n) &&
            Number.isFinite(n) &&
            n > 0
        );
};

function validateNumberList(list, max) {
    if (!Array.isArray(list)) return [];

    const result = [];

    for (const n of list) {
        if (
            !Number.isInteger(n) ||
            !Number.isFinite(n) ||
            n <= 0 ||
            n > max
        ) {
            continue;
        }

        if (!result.includes(n)) {
            result.push(n);
        }
    }

    return result;
}

const Validator = {

    validateGroup: (data) => {
        try {
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
                return null;
            }

            const rawMax = Number(data.max);
            const rawJokerMax = Number(data.jokerMax);
            const rawJokerPerSet = Number(data.jokerPerSet);

            const max =
                Number.isInteger(rawMax) && rawMax > 0
                    ? rawMax
                    : 49;

            const jokerMax =
                Number.isInteger(rawJokerMax) && rawJokerMax > 0
                    ? rawJokerMax
                    : 0;

            const jokerPerSet =
                Number.isInteger(rawJokerPerSet) && rawJokerPerSet > 0
                    ? rawJokerPerSet
                    : 0;

            const safeJokerPerSet =
                jokerMax > 0
                    ? Math.min(jokerPerSet, jokerMax)
                    : 0;

            const validatedSets = Array.isArray(data.sets)
                ? data.sets
                    .map(set => {

                        if (
                            !set ||
                            typeof set !== "object" ||
                            Array.isArray(set)
                        ) {
                            return null;
                        }

                        const numbers =
                            validateNumberList(
                                cleanNumberArray(set.numbers),
                                max
                            );

                        const jokers =
                            jokerMax > 0
                                ? validateNumberList(
                                    cleanNumberArray(set.jokers),
                                    jokerMax
                                )
                                : [];

                        return {
                            numbers,
                            jokers,
                            max,
                            jokerMax
                        };
                    })
                    .filter(set => {
                        if (!set) return false;

                        if (set.numbers.length === 0) {
                            return false;
                        }

                        if (set.numbers.length > max) {
                            return false;
                        }

                        if (jokerMax === 0 && set.jokers.length > 0) {
                            return false;
                        }

                        if (
                            safeJokerPerSet > 0 &&
                            set.jokers.length > safeJokerPerSet
                        ) {
                            return false;
                        }

                        return true;
                    })
                : [];

            const resultsMain =
                validateNumberList(
                    cleanNumberArray(data.results?.main),
                    max
                );

            const resultsJoker =
                jokerMax > 0
                    ? validateNumberList(
                        cleanNumberArray(data.results?.joker),
                        jokerMax
                    )
                    : [];

            const safeResultsMain = resultsMain.slice(0, 10);

            const safeResultsJoker =
                safeJokerPerSet > 0
                    ? resultsJoker.slice(0, safeJokerPerSet)
                    : [];

            const safeId =
                data.id !== undefined &&
                data.id !== null &&
                String(data.id).trim() !== ""
                    ? String(data.id)
                    : String(Date.now());

            const safeName =
                data.name !== undefined &&
                data.name !== null &&
                String(data.name).trim() !== ""
                    ? String(data.name)
                    : "İsimsiz Liste";

            const rawVersion = Number(data.version);

            const version =
                Number.isFinite(rawVersion) && rawVersion > 0
                    ? rawVersion
                    : Date.now();

            return {
                id: safeId,
                name: safeName,
                sets: validatedSets,
                max,
                jokerMax,
                jokerPerSet: safeJokerPerSet,
                results: {
                    main: safeResultsMain,
                    joker: safeResultsJoker
                },
                version
            };

        } catch (e) {
            return null;
        }
    }
};

/* --- WRITE LOCK --- */

let lockQueue = Promise.resolve();

async function withLock(workFn) {

    if (navigator.locks) {
        return navigator.locks.request(
            DB_CONFIG.lockName,
            async () => {
                return await workFn();
            }
        );
    }

    const currentLock = lockQueue.then(() => workFn());

    lockQueue = currentLock.catch(() => {
    });

    return currentLock;
}

async function getDraft(id) {
    try {
        const db = await getDB();

        return await new Promise((resolve, reject) => {

            let settled = false;

            const finishError = (error) => {
                if (settled) return;
                settled = true;
                reject(error instanceof Error ? error : new Error(String(error)));
            };

            const finishSuccess = (value) => {
                if (settled) return;
                settled = true;
                resolve(value);
            };

            let tx;

            try {
                tx = db.transaction(DB_CONFIG.draftStore, "readonly");
            } catch (e) {
                finishError(e);
                return;
            }

            const req = tx.objectStore(DB_CONFIG.draftStore).get(id);

            req.onsuccess = () => {
                finishSuccess(req.result);
            };

            req.onerror = () => {
                finishError(
                    req.error || new Error("Draft okuma hatası.")
                );
            };

            req.onabort = () => {
                finishError(
                    new Error("Draft okuma işlemi iptal edildi.")
                );
            };

            tx.onerror = () => {
                finishError(
                    tx.error || new Error("Draft transaction hatası.")
                );
            };

            tx.onabort = () => {
                finishError(
                    tx.error || new Error("Draft transaction iptal edildi.")
                );
            };
        });

    } catch(e) {
        ErrorHandler.report("Draft Get Error", e);
        return null;
    }
}

            "data:text/json;charset=utf-8," +
            encodeURIComponent(
                JSON.stringify(groups, null, 2)
            );

        const downloadAnchor =
            document.createElement('a');

        downloadAnchor.setAttribute(
            "href",
            dataStr
        );

        downloadAnchor.setAttribute(
            "download",
            `LuckyGenerator_Yedek_${new Date().toISOString().slice(0,10)}.json`
        );

        document.body.appendChild(downloadAnchor);

        downloadAnchor.click();

        downloadAnchor.remove();

    } catch(e) {
        ErrorHandler.report("Export Error", e);
    }
}

function triggerImport() {
    getEl("import-file-input").click();
}

async function handleFileImport(event) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = async (e) => {
        try {
            const importedData =
                JSON.parse(e.target.result);

            if (!Array.isArray(importedData)) {
                throw new Error(
                    "Geçersiz yedek dosyası formatı."
                );
            }

            let count = 0;

            for (const item of importedData) {
                const valid =
                    Validator.validateGroup(item);

                if (valid) {
                    await atomicSave(valid);
                    count++;
                }
            }

            alert(
                `${count} adet liste başarıyla yükledi.`
            );

            renderCurrentState("mySets");

        } catch(err) {
            alert(
                "Yükleme başarısız: " +
                (err?.message || "Bilinmeyen hata")
            );
        } finally {
            event.target.value = "";
        }
    };

    reader.onerror = () => {
        alert("Dosya okunamadı.");
        event.target.value = "";
    };

    reader.readAsText(file);
}

/* --- DRAFT VALIDATION --- */

function normalizeGeneratedSetsDraft(data) {

    if (!Array.isArray(data)) {
        return [];
    }

    const safeSets = [];

    for (const set of data) {

        if (
            !set ||
            typeof set !== "object" ||
            Array.isArray(set) ||
            !Array.isArray(set.numbers) ||
            !Array.isArray(set.jokers)
        ) {
            continue;
        }

        const rawMax = Number(set.max);
        const rawJokerMax = Number(set.jokerMax);

        if (
            !Number.isSafeInteger(rawMax) ||
            rawMax < 1 ||
            rawMax > GENERATION_LIMITS.max
        ) {
            continue;
        }

        if (
            !Number.isSafeInteger(rawJokerMax) ||
            rawJokerMax < 0 ||
            rawJokerMax > GENERATION_LIMITS.jokerMax
        ) {
            continue;
        }

        const numbers =
            validateNumberList(
                cleanNumberArray(set.numbers),
                rawMax
            );

        const jokers =
            rawJokerMax > 0
                ? validateNumberList(
                    cleanNumberArray(set.jokers),
                    rawJokerMax
                )
                : [];

        if (
            numbers.length === 0 ||
            numbers.length > GENERATION_LIMITS.per
        ) {
            continue;
        }

        if (
            rawJokerMax === 0 &&
            jokers.length > 0
        ) {
            continue;
        }

        if (
            jokers.length > GENERATION_LIMITS.jokerPer
        ) {
            continue;
        }

        safeSets.push({
            numbers,
            jokers,
            max: rawMax,
            jokerMax: rawJokerMax
        });
    }

    return safeSets;
}

function normalizeDraftInputs(data) {

    const defaults = {
        max: 35,
        per: 5,
        jMax: 31,
        jPer: 1,
        count: 5
    };

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {
        return defaults;
    }

    const max = Number(data.max);
    const per = Number(data.per);
    const jMax = Number(data.jMax);
    const jPer = Number(data.jPer);
    const count = Number(data.count);

    if (
        !Number.isSafeInteger(max) ||
        max < 1 ||
        max > GENERATION_LIMITS.max
    ) {
        return defaults;
    }

    if (
        !Number.isSafeInteger(per) ||
        per < 1 ||
        per > GENERATION_LIMITS.per ||
        per > max
    ) {
        return defaults;
    }

    if (
        !Number.isSafeInteger(jMax) ||
        jMax < 0 ||
        jMax > GENERATION_LIMITS.jokerMax
    ) {
        return defaults;
    }

    if (
        !Number.isSafeInteger(jPer) ||
        jPer < 0 ||
        jPer > GENERATION_LIMITS.jokerPer ||
        (jPer > 0 && jMax < jPer)
    ) {
        return defaults;
    }

    if (
        !Number.isSafeInteger(count) ||
        count < 1 ||
        count > GENERATION_LIMITS.count
    ) {
        return defaults;
    }

    return {
        max,
        per,
        jMax,
        jPer,
        count
    };
}

async function requestPersistentStorage() {
    if (
        navigator.storage &&
        navigator.storage.persist
    ) {
        try {
            const isPersisted =
                await navigator.storage.persisted();

            if (!isPersisted) {
                await navigator.storage.persist();
            }
        } catch(e) {
            ErrorHandler.report(
                "Persistent Storage Error",
                e
            );
        }
    }
}

        );

        );

window.onpopstate = async (event) => {

    lastRequestId++;

    panelPreviousState = null;

    const state =
        event.state ||
        {
            page:"generate",
            groupId:null
        };

    if (state.page !== "panel") {
        closeResultPanel(false);
    }

    await renderCurrentState(
        state.page,
        state.groupId
    );

    if (
        state.page === "panel" &&
        state.groupId &&
        history.state?.page === "panel" &&
        String(history.state.groupId) === String(state.groupId)
    ) {
        await openResultPanel(
            null,
            state.groupId,
            false
        );
    }
};

function navTo(page, groupId = null) {

    if (isProcessing) return;

    if (page !== "panel") {
        lastRequestId++;
        panelPreviousState = null;
    }

    history.pushState(
        {
            page,
            groupId: groupId
                ? String(groupId)
                : null
        },
        ""
    );

    renderCurrentState(
        page,
        groupId
    );
}

async function renderCurrentState(page, groupId) {

    const currentRequestId =
        ++lastRequestId;

    const container =
        getEl("view-container");

    if(!container) return;

    if (page !== "panel") {

        const panel =
            getEl("resultPanel");

        if(panel) {
            panel.style.display = "none";
        }

        toggleBodyScroll(false);

        container.innerHTML =
            `<div style="padding:20px; color:#666;">
                Yükleniyor...
            </div>`;
    }

    try {

        if (page === "generate") {

            if (
                currentRequestId ===
                lastRequestId
            ) {
                await renderGeneratePage();
            }

        } else if (page === "mySets") {

            if (groupId) {

                const group =
                    await getGroupById(groupId);

                if (
                    currentRequestId ===
                    lastRequestId
                ) {
                    group
                        ? await renderViewGroup(
                            group,
                            currentRequestId
                        )
                        : await renderMySetsList(
                            currentRequestId
                        );
                }

            } else {

                await renderMySetsList(
                    currentRequestId
                );
            }
        }

    } catch (e) {

        ErrorHandler.report(
            "Render Error",
            e
        );

    } finally {

        if (
            currentRequestId !== lastRequestId &&
            container.innerHTML.includes("Yükleniyor...")
        ) {
            container.innerHTML = "";
        }
    }
}

async function renderGeneratePage() {

    /*
     * Bu render işleminin başlangıcındaki navigation isteğini
     * sabitleriz. IndexedDB beklemeleri sırasında kullanıcı
     * başka bir sayfaya geçerse eski render işlemi DOM'a
     * tekrar yazı yazamaz.
     */
    const requestId = lastRequestId;

    let storedInputs = {
        max:35,
        per:5,
        jMax:31,
        jPer:1,
        count:5
    };

    const dSets =
        await getDraft("tempSets");

    /*
     * İlk asenkron işlemden sonra navigation değiştiyse
     * bu eski render işlemini tamamen bırak.
     */
    if (requestId !== lastRequestId) {
        return;
    }

    const dInputs =
        await getDraft("tempInputs");

     */
    if (requestId !== lastRequestId) {
        return;
    }

    generatedSets =

            : [];

     */
    if (requestId !== lastRequestId) {
        return;
    }

    getEl("view-container").innerHTML = `
        <div class="container">
            <div class="card">
                <b>Ana Grup (1 - ?)</b>
                <input type="number" id="maxNumber" min="1" max="${GENERATION_LIMITS.max}" value="${storedInputs.max}">
                <label>Seçilecek Sayı</label>
                <input type="number" id="perSet" min="1" max="${GENERATION_LIMITS.per}" value="${storedInputs.per}">
                <hr>
                <b>Joker (1 - ?)</b>
                <input type="number" id="jokerMax" min="0" max="${GENERATION_LIMITS.jokerMax}" value="${storedInputs.jMax}">
                <label>Joker Sayısı</label>
                <input type="number" id="jokerCount" min="0" max="${GENERATION_LIMITS.jokerPer}" value="${storedInputs.jPer}">
                <hr>
                <label>Kolon Sayısı</label>
                <input type="number" id="setCount" min="1" max="${GENERATION_LIMITS.count}" value="${storedInputs.count}">
                <button id="btn-generate-action">Rastgele Üret</button>
            </div>

async function generateSets() {

    if (isProcessing) return;

    const maxEl = getEl("maxNumber");
    const perEl = getEl("perSet");
    const jMaxEl = getEl("jokerMax");
    const jPerEl = getEl("jokerCount");
    const countEl = getEl("setCount");

    if (
        !maxEl ||
        !perEl ||
        !jMaxEl ||
        !jPerEl ||
        !countEl
    ) return;

    const max =
        parseInt(maxEl.value, 10) || 0;

    const per =
        parseInt(perEl.value, 10) || 0;

    const jMax =
        parseInt(jMaxEl.value, 10) || 0;

    const jPer =
        parseInt(jPerEl.value, 10) || 0;

    const count =
        parseInt(countEl.value, 10) || 0;

    if (
        !Number.isSafeInteger(max) ||
        !Number.isSafeInteger(per) ||
        !Number.isSafeInteger(jMax) ||
        !Number.isSafeInteger(jPer) ||
        !Number.isSafeInteger(count) ||
        max < 1 ||
        max > GENERATION_LIMITS.max ||
        per < 1 ||
        per > GENERATION_LIMITS.per ||
        per > max ||
        jMax < 0 ||
        jMax > GENERATION_LIMITS.jokerMax ||
        jPer < 0 ||
        jPer > GENERATION_LIMITS.jokerPer ||
        (jPer > 0 && jMax < jPer) ||
        count < 1 ||
        count > GENERATION_LIMITS.count
    ) {
        alert(
            `Geçersiz üretim parametresi! Üst sınırlar: ` +
            `Ana maksimum ${GENERATION_LIMITS.max}, ` +
            `ana seçim ${GENERATION_LIMITS.per}, ` +
            `Joker maksimum ${GENERATION_LIMITS.jokerMax}, ` +
            `Joker seçim ${GENERATION_LIMITS.jokerPer}, ` +
            `kolon ${GENERATION_LIMITS.count}.`
        );
        return;
    }

    try {

        setLoading(true);
        isProcessing = true;

        generatedSets = [];

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const mainPool =
                Array.from(
                    {length: max},
                    (_, k) => k + 1
                );

            const n =
                secureShuffle(
                    [...mainPool]
                )
                .slice(0, per)
                .sort(
                    (a,b) => a-b
                );

            let j = [];

            if (
                jMax > 0 &&
                jPer > 0
            ) {

                const jokerPool =
                    Array.from(
                        {length: jMax},
                        (_, k) => k + 1
                    );

                j =
                    secureShuffle(
                        [...jokerPool]
                    )
                    .slice(0, jPer)
                    .sort(
                        (a,b) => a-b
                    );
            }

            generatedSets.push({
                numbers: n,
                jokers: j,
                max,
                jokerMax: jMax
            });
        }

        await saveDraft(
            "tempSets",
            generatedSets
        );

        await saveDraft(
            "tempInputs",
            {
                max,
                per,
                jMax,
                jPer,
                count
            }
        );

        renderGeneratedSetsList();

    } catch(e) {

        ErrorHandler.report(
            "Generate Error",
            e
        );

    } finally {

        setLoading(false);
        isProcessing = false;
    }
}

async function saveGroup() {

    if (isProcessing) return;

    const nameEl =
        getEl("groupNameInput");

    if (!nameEl) return;

    const name =
        nameEl.value.trim();

    if (!name) {
        alert("İsim verin.");
        return;
    }

    const maxVal =
        generatedSets.length > 0
            ? generatedSets[0].max
            : (
                parseInt(
                    getEl("maxNumber")?.value,
                    10
                ) || 49
            );

    const jMaxVal =
        generatedSets.length > 0
            ? generatedSets[0].jokerMax
            : (
                parseInt(
                    getEl("jokerMax")?.value,
                    10
                ) || 0
            );

    const jPerVal =
        parseInt(
            getEl("jokerCount")?.value,
            10
        ) ||
        (
            generatedSets.length > 0
                ? generatedSets[0].jokers.length
                : 0
        );

    const group = {
        id: String(Date.now()),
        name: name,
        sets: [...generatedSets],
        max: maxVal,
        jokerMax: jMaxVal,
        jokerPerSet: jPerVal,
        results: {
            main: [],
            joker: []
        }
    };

    try {

        setLoading(true);
        isProcessing = true;

        await atomicSave(group);

        await deleteDraft("tempSets");
        await deleteDraft("tempInputs");

        navTo(
            'mySets',
            group.id
        );

    } catch(err) {

        ErrorHandler.report(
            "Save Error",
            err
        );

    } finally {

        isProcessing = false;
        setLoading(false);
    }
}

async function openResultPanel(
    max,
    groupId,
    shouldPushState = true
) {

    const requestId =
        lastRequestId;

    const requestedGroupId =
        String(groupId);

    const group =
        await getGroupById(groupId);

    if (
        requestId !== lastRequestId ||
        history.state?.groupId !== requestedGroupId ||
        (
            shouldPushState &&
            history.state?.page !== "mySets"
        )
    ) {
        return;
    }

    if(!group) return;

    const targetMax =
        max || group.max;

    const resDiv =
        getEl("resultNumbers");

    if(!resDiv) return;

    resDiv.innerHTML = "";

    const createRow =
        (
            title,
            limit,
            isJoker
        ) => {

            const h =
                document.createElement("h4");

            h.textContent = title;
            h.style.margin =
                "15px 0 5px 0";

            const row =
                document.createElement("div");

            row.className =
                "ball-row";

            for(
                let i = 1;
                i <= limit;
                i++
            ) {

                const ball =
                    document.createElement("div");

                ball.className =
                    "ball" +
                    (
                        isJoker
                            ? " joker"
                            : ""
                    );

                const list =
                    isJoker
                        ? group.results.joker
                        : group.results.main;

                if(list.includes(i)) {
                    ball.classList.add(
                        "result-selected"
                    );
                }

                ball.textContent = i;

                ball.onclick =
                    () =>
                        toggleResult(
                            ball,
                            groupId,
                            i,
                            isJoker
                        );

                row.appendChild(ball);
            }

            resDiv.append(
                h,
                row
            );
        };

    createRow(
        `Ana Sayılar (1-${targetMax})`,
        targetMax,
        false
    );

    if (group.jokerPerSet > 0) {

        createRow(
            `Joker Sayılar (1-${group.jokerMax})`,
            group.jokerMax,
            true
        );
    }

    if (shouldPushState) {

        if (
            requestId !== lastRequestId
        ) {
            return;
        }

        const currentState = history.state;

        panelPreviousState =
            currentState &&
            currentState.page === "mySets" &&
            currentState.groupId !== undefined &&
            currentState.groupId !== null &&
            String(currentState.groupId) === requestedGroupId
                ? {
                    page: "mySets",
                    groupId: requestedGroupId
                }
                : null;

        history.pushState(
            {
                page: "panel",
                groupId: requestedGroupId
            },
            ""
        );
    }

    if (
        history.state?.groupId !==
        requestedGroupId
    ) {
        panelPreviousState = null;
        return;
    }

    getEl("resultPanel").style.display =
        "block";

    toggleBodyScroll(true);
}

async function toggleResult(
    el,
    id,
    val,
    isJoker
) {

    if (isProcessing) return;

    isProcessing = true;

    el.style.opacity = "0.4";

    let updatedGroup = null;

    try {

        const g =
            await getGroupById(id);

        if (g) {

            const list =
                isJoker
                    ? g.results.joker
                    : g.results.main;

            const idx =
                list.indexOf(val);

            if (idx > -1) {

                list.splice(idx, 1);

            } else {

                const limit =
                    isJoker
                        ? (
                            g.jokerPerSet > 0
                                ? g.jokerPerSet
                                : 10
                        )
                        : 10;

                if (
                    list.length >= limit
                ) {
                    alert(
                        isJoker
                            ? "Joker limiti!"
                            : "Maks 10 sayı!"
                    );

                    return;
                }

                list.push(val);
            }

            await atomicSave(g);

            el.classList.toggle(
                "result-selected"
            );

            updatedGroup = g;
        }

    } catch(e) {

        ErrorHandler.report(
            "Result Toggle Error",
            e
        );

    } finally {

        el.style.opacity = "1";

        isProcessing = false;

        if (
            updatedGroup &&
            history.state?.groupId === String(id)
        ) {
            await renderViewGroup(
                updatedGroup,
                lastRequestId
            );
        }
    }
}

async function deleteGroup(id) {

    if (
        isProcessing ||
        !confirm("Silinsin?")
    ) return;

    try {

        setLoading(true);
        isProcessing = true;

        await deleteFromDB(id);

        await renderMySetsList(
            lastRequestId
        );

    } catch(e) {

        ErrorHandler.report(
            "Delete Error",
            e
        );

    } finally {

        setLoading(false);
        isProcessing = false;
    }
}

function closeResultPanel(
    forceBack = true
) {

    const currentState =
        history.state;

    const isPanelState =
        currentState &&
        currentState.page === "panel";

    const panel =
        getEl("resultPanel");

    if(panel) {
        panel.style.display =
            "none";
    }

    toggleBodyScroll(false);

    if (
        forceBack &&
        isPanelState
    ) {

        const currentGroupId =
            String(currentState.groupId);

        const previousState =
            panelPreviousState;

        panelPreviousState = null;

        if (
            previousState &&
            previousState.page === "mySets" &&
            String(previousState.groupId) === currentGroupId
        ) {
            history.back();
        } else {

            navTo(
                'mySets',
                currentGroupId
            );
        }
    }
}

function confirmResult() {
    closeResultPanel(true);
}

async function cleanResult() {

    const id =
        history.state?.groupId;

    if (
        isProcessing ||
        !id ||
        !confirm(
            "Seçimler temizlensin mi?"
        )
    ) return;

    let updatedGroup = null;

    try {

        setLoading(true);
        isProcessing = true;

        const g =
            await getGroupById(id);

        if(g) {

            g.results = {
                main: [],
                joker: []
            };

            await atomicSave(g);

            updatedGroup = g;

            document
                .querySelectorAll(
                    "#resultNumbers .ball"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "result-selected"
                        )
                );
        }

    } catch(e) {

        ErrorHandler.report(
            "Clean Result Error",
            e
        );

    } finally {

        setLoading(false);
        isProcessing = false;

        if (updatedGroup) {

            await renderViewGroup(
                updatedGroup,
                lastRequestId
            );
        }
    }
}

async function clearGeneratedSets() {

    if (
        isProcessing ||
        !confirm(
            "Üretilen tüm kolonlar temizlensin mi?"
        )
    ) return;

    try {

        isProcessing = true;

        generatedSets = [];

        await deleteDraft(
            "tempSets"
        );

        await deleteDraft(
            "tempInputs"
        );

        renderGeneratedSetsList();

    } catch(e) {

        ErrorHandler.report(
            "Clear Drafts Error",
            e
        );

    } finally {

        isProcessing = false;
    }
}
</script>
